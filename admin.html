<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>위험물기능사 학습실 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: 좁은 본문 칼럼 + 상단(데스크톱)/하단(모바일) 메뉴. 중립 회색 지면, 남색 강조 하나, 안전표지 색은 법정 색 */
:root{
  --accent:#1F3A5F; --accent-ink:#ffffff; --accent-soft:#e8edf4;
  --bg:#f4f5f7; --surface:#ffffff; --ink:#1b2430; --muted:#5d6775; --line:#dde1e7; --line-strong:#c4cad3;
  --ok:#1d7a46; --ok-soft:#e5f3eb; --bad:#c0392b; --bad-soft:#fbe9e7; --warn:#b5650a; --warn-soft:#fcf1e2;
  --sign-red:#d32f2f; --sign-blue:#1f4fa3; --sign-yellow:#f4c20d; --sign-black:#111111;
  --shadow:0 1px 2px rgba(27,36,48,.05),0 4px 14px rgba(27,36,48,.05);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#8fb3e3; --accent-ink:#0e1621; --accent-soft:#1e2a3a;
  --bg:#12161c; --surface:#1a2029; --ink:#e7eaee; --muted:#9aa3ae; --line:#2b333e; --line-strong:#3a4452;
  --ok:#5fc98d; --ok-soft:#173225; --bad:#ef8576; --bad-soft:#3a1d1a; --warn:#eab162; --warn-soft:#3a2b14;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:#8fb3e3; --accent-ink:#0e1621; --accent-soft:#1e2a3a;
  --bg:#12161c; --surface:#1a2029; --ink:#e7eaee; --muted:#9aa3ae; --line:#2b333e; --line-strong:#3a4452;
  --ok:#5fc98d; --ok-soft:#173225; --bad:#ef8576; --bad-soft:#3a1d1a; --warn:#eab162; --warn-soft:#3a2b14;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html{font-size:var(--fs,100%)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:.875rem;color:var(--muted)}
.muted{color:var(--muted)}
b{font-weight:700}

/* 상단바 */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:.75rem;color:var(--muted)}
.who{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.who .mono{color:var(--ink);font-weight:600}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:.8rem}
.nav{display:flex;gap:2px;max-width:960px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.nav button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:.92rem;color:var(--muted);border-bottom:3px solid transparent}
.nav button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.bnav{display:none}
@media (max-width:720px){
  .nav{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .bnav button{border:0;background:none;padding:6px 2px;font-size:.72rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
  .bnav button svg{width:22px;height:22px}
  .bnav button[aria-current="true"]{color:var(--accent)}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
}

/* 본문 */
.main{max-width:960px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.page-h{display:flex;flex-direction:column;gap:4px}
.page-h h1{font-size:1.5rem}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:1.2rem}
.card h3{font-size:1.02rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 18px;font-weight:700;font-size:.95rem;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.plain{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.gray{background:var(--bg);color:var(--muted)}
.check{display:inline-block;font-size:.7rem;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:0 6px;border-radius:4px;margin-left:4px;font-family:var(--f-body);vertical-align:1px}

/* 진행 막대 */
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok i{background:var(--ok)}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat small{font-size:.75rem;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* 학번 화면 */
.start{max-width:460px;margin:8vh auto 0;width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.input{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:11px 14px;font-size:1.05rem;width:100%;min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}

/* 강 카드 */
.lec{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lec:hover{border-color:var(--accent)}
.lec .no{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:600}
.lec h3{font-size:1.05rem}
.lec .sub{font-size:.82rem;color:var(--muted)}
.lec .m{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.75rem;color:var(--muted)}
.lec .m b{display:block;font-family:var(--f-mono);font-size:.95rem;color:var(--ink)}

/* 사고 사례 */
.case-scene{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.case-meta{display:flex;gap:6px;flex-wrap:wrap}
.clues{display:flex;flex-direction:column;gap:8px;counter-reset:c}
.clue{border:1px dashed var(--line-strong);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.clue .k{font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--accent);flex:none;padding-top:2px}
.clue.locked{background:var(--bg);color:var(--muted)}
.clue.locked button{margin-left:auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;min-height:48px}
.opt .n{font-family:var(--f-mono);font-weight:700;color:var(--muted);flex:none}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .n{color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .n{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .n{color:var(--bad)}
.opt:disabled{cursor:default}
.opt .why{display:block;font-size:.85rem;color:var(--muted);margin-top:4px}
.verdict{border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--bad-soft)}
.verdict b.v{font-size:1.05rem}
.verdict.ok b.v{color:var(--ok)} .verdict.bad b.v{color:var(--bad)}
.explain{display:grid;gap:8px}
.explain div{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:.92rem}
.explain div b{color:var(--muted);font-size:.82rem;padding-top:1px}

/* 강 페이지 */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem;color:var(--muted)}
.steps button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.concept-nav{display:flex;gap:6px;flex-wrap:wrap}
.concept-nav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:.8rem;color:var(--muted)}
.concept-nav button.seen{border-color:var(--line-strong);color:var(--ink)}
.concept-nav button[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.concept table{border-collapse:collapse;width:100%;font-size:.92rem}
.concept th,.concept td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.concept thead th{background:var(--bg);font-size:.82rem;color:var(--muted)}
.concept td.num{text-align:right;white-space:nowrap}
.concept ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.concept .body{display:flex;flex-direction:column;gap:12px;overflow-x:auto}
.formula{font-family:var(--f-mono);background:var(--accent-soft);color:var(--accent);padding:10px 14px;border-radius:8px;font-weight:600;font-size:.95rem}
.src{font-size:.78rem;color:var(--muted)}
.tbl-x{overflow-x:auto}
table.mix{width:auto}
table.mix th,table.mix td{text-align:center;min-width:44px}
table.mix td.o{color:var(--ok);font-weight:700;background:var(--ok-soft)} table.mix td.x{color:var(--bad)}
.firegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fg{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.fg b{font-family:var(--f-mono);font-size:1.3rem}
.fg em{font-style:normal;font-weight:600;font-size:.88rem}
.fg small{font-size:.78rem;color:var(--muted)}
.sw{width:36px;height:12px;border-radius:99px;border:1px solid var(--line-strong)}
.sw-none{background:repeating-linear-gradient(45deg,transparent 0 3px,var(--line-strong) 3px 4px)}
@media (max-width:620px){.firegrid{grid-template-columns:repeat(2,1fr)}}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sign{border-radius:4px;padding:14px 8px;text-align:center;font-weight:800;font-size:1.05rem;letter-spacing:.04em;display:flex;flex-direction:column;gap:6px;border:1px solid #00000022}
.sign small{font-weight:500;font-size:.7rem;letter-spacing:0;line-height:1.3}
.s-white{background:#ffffff;color:#111111}.s-red{background:var(--sign-red);color:#ffffff}.s-blue{background:var(--sign-blue);color:#ffffff}
.s-yellow{background:var(--sign-yellow);color:#111111}.s-black{background:var(--sign-black);color:var(--sign-yellow)}

/* 문제 */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.04em}
.qtimer{margin-left:auto;font-family:var(--f-mono);font-weight:700}
.qtimer.low{color:var(--bad)}
.qtext{font-size:1.15rem;font-weight:700}
.result-big{font-family:var(--f-mono);font-size:2.6rem;font-weight:700;line-height:1}
.result-big small{font-size:1.1rem;color:var(--muted)}
.qlist{display:flex;flex-direction:column;gap:6px}
.qitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.qitem .mono{font-size:.8rem;color:var(--muted)}

/* 암기 */
.tools{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tools button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tools button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.flash{perspective:1000px;border:0;background:none;padding:0;width:100%;height:200px}
.flash .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash[aria-pressed="true"] .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:var(--r);border:1px solid var(--line-strong);text-align:center}
.flash .f{background:var(--surface);font-size:1.25rem;font-weight:700}
.flash .b{background:var(--accent-soft);color:var(--accent);transform:rotateY(180deg);font-size:1.3rem;font-weight:700}
.flash small{font-size:.75rem;font-weight:500;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.flash .in{transition:none}}
.fill table{border-collapse:collapse;font-size:.92rem}
.fill th,.fill td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.fill thead th{background:var(--bg);color:var(--muted);font-size:.8rem}
.fill td.h{font-weight:600;text-align:left;white-space:nowrap}
.fill input{width:100%;min-width:72px;border:1px solid var(--line-strong);border-radius:6px;padding:6px;text-align:center;background:var(--bg)}
.fill td.ok input,.fill td.ok .tg{border-color:var(--ok);background:var(--ok-soft)}
.fill td.bad input,.fill td.bad .tg{border-color:var(--bad);background:var(--bad-soft)}
.fill .tg{width:40px;height:34px;border:1px dashed var(--line-strong);border-radius:6px;background:var(--bg);font-weight:700}
.fill td .ans{display:block;font-size:.72rem;color:var(--bad)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;min-height:46px}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.mi.no{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mi.no{animation:none}}
.mnemo{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.mnemo b{font-size:1.15rem;color:var(--accent)}
.memo-set{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer}
.memo-set:hover{border-color:var(--accent)}
.mast{font-family:var(--f-mono);font-weight:700;font-size:.9rem}
.answer-row{display:flex;gap:8px}
.answer-row .input{flex:1}

/* 현황 */
.lecrow{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;font-size:.9rem}
.lecrow .num{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:50;max-width:calc(100vw - 32px)}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sync{font-size:.75rem;color:var(--muted)}

.icon-btn{white-space:nowrap}
@media (max-width:420px){.who>span:first-child{display:none}}

[hidden]{display:none!important}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.filters .input{padding:8px 10px;font-size:.92rem}
table.adm{width:100%;border-collapse:collapse;font-size:.88rem}
table.adm th,table.adm td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.adm th{background:var(--bg);font-size:.78rem;color:var(--muted);white-space:nowrap}
table.adm td.num{font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.lowv{color:var(--bad);font-weight:700;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.qrwrap{width:min(260px,70vw);background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line)}
.qrwrap svg{display:block;width:100%;height:auto}
.who a.icon-btn{text-decoration:none;color:inherit}
@media print{.top,.filters,.steps,.row{display:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand"><b id="brand-title">관리</b><small>관리자 전용 페이지</small></div><div class="who" id="who"></div></div></header>
<main class="main" id="main"></main>
<script>
/* ================== 설정 (교사가 바꾸는 곳) ==================
   비밀번호는 여기에 쓰지 않습니다. Apps Script의 스크립트 속성 ADMIN_KEY 에만 저장하세요. */
const ADMIN = {
  TITLE: "위험물기능사 학습실",
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzuEN_1d2IkJt1A7tndq5FMun4ruAzSu2MkOaWsDa_q719wZkMnkGD17Z6ubYbM9CW6zg/exec",     // Apps Script 웹 앱 주소 (…/exec) - 학습자 페이지와 같은 주소
  LEARNER_URL: "https://changsoone.github.io/Hazard/",    // 학습자 페이지 주소 (QR 생성용)
  ACCENT: "#1F3A5F"
};
</script>
<script>

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {

          var buffer = qrBitBuffer();

            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';

        qrHtml += '</tr>';

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +

      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {

            qrSvg += 'M' + mc + ',' + mr + rect;

      qrSvg += '</svg>';

    };

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;

        }
      } );
    };

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {

        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }

      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {

        '█ ': '▀',
        ' █': '▄',
        '  ': ' '

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];

        ascii += '\n';

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');

      return ascii.substring(0, ascii.length-1);

    _this.createASCII = function(cellSize, margin) {

      if (cellSize < 2) {
        return _createHalfASCII(margin);

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  qrcode.stringToBytesFuncs = {

  // qrcode.createStringToBytes

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

<script>
/* =====================================================================

const DATA = {};

/* ---------- 강의 ---------- */
DATA.LECTURES = [
 { id:1, title:"화재예방과 소화방법", sub:"연소 이론 · 소화 원리 · 소화약제 · 화재 종류",
   concepts:[
    { id:"1-1", title:"연소의 3요소와 4요소", body:`
      <p>불이 나려면 <b>가연물 · 산소공급원 · 점화원</b> 세 가지가 모두 있어야 한다. 여기에 <b>연쇄반응</b>을 더하면 연소의 4요소다.</p>
      <table><thead><tr><th>요소</th><th>핵심</th></tr></thead><tbody>
      <tr><td>가연물</td><td>열전도율이 <b>낮고</b>, 활성화 에너지가 <b>작고</b>, 표면적이 <b>넓을수록</b> 잘 탄다</td></tr>
      <tr><td>가연물이 될 수 없는 것</td><td>CO₂·H₂O(더 이상 산소와 반응 안 함), 18족 원소(He·Ne·Ar), 질소·질소산화물(흡열 반응)</td></tr>
      <tr><td>산소공급원</td><td>공기(산소), 제1류·제5류·제6류 위험물, 할로겐 분자(F₂·Cl₂·Br₂·I₂)</td></tr>
      <tr><td>점화원</td><td>활성화 에너지를 주는 것(노출된 불꽃 등). <b>기화열은 점화원이 될 수 없다</b></td></tr>
      </tbody></table>`, src:"1강 연소의 3요소" },
    { id:"1-2", title:"연소의 형태", body:`
      <p>같은 고체라도 타는 방식이 다르다. 시험에서는 <b>물질 → 연소 형태</b>를 묻는다.</p>
      <table><thead><tr><th>상태</th><th>연소 형태</th><th>대표 물질</th></tr></thead><tbody>
      <tr><td>기체</td><td>확산연소</td><td>수소, 아세틸렌</td></tr>
      <tr><td>액체</td><td>증발연소</td><td>알코올, 에테르, 석유, 아세톤</td></tr>
      <tr><td rowspan="4">고체</td><td>표면연소</td><td>목탄, 코크스, 금속분</td></tr>
      <tr><td>분해연소</td><td>석탄, 종이, 목재, 플라스틱</td></tr>
      <tr><td>증발연소</td><td>나프탈렌, 장뇌, 유황, 양초(파라핀)</td></tr>
      <tr><td>자기연소</td><td>제5류 위험물(니트로글리세린, 니트로셀룰로오스, 질산에스테르류)</td></tr>
      </tbody></table>`, src:"1강 연소의 형태" },
    { id:"1-3", title:"인화점 · 착화점 · 연소점과 자연발화", body:`
      <table><thead><tr><th>용어</th><th>뜻</th></tr></thead><tbody>
      <tr><td>인화점</td><td>점화원을 접촉시켰을 때 불이 붙는 최저온도</td></tr>
      <tr><td>착화점(발화점)</td><td>점화원 없이 축적된 열만으로 연소를 일으키는 최저온도</td></tr>
      <tr><td>연소점</td><td>점화원을 제거해도 계속 타는 온도 (인화점보다 약 10℃ 높음)</td></tr>
      </tbody></table>
      <p><b>자연발화</b>: 상온에서 저절로 열이 쌓여 발화하는 현상</p>
      <table><thead><tr><th>원인</th><th>대표 물질</th></tr></thead><tbody>
      <tr><td>산화열</td><td>석탄, 건성유, 고무분말</td></tr>
      <tr><td>분해열</td><td>셀룰로이드, 니트로셀룰로오스</td></tr>
      <tr><td>흡착열</td><td>목탄분말, 활성탄</td></tr>
      <tr><td>미생물</td><td>퇴비</td></tr></tbody></table>
      <p class="small">고온체 색: 암적색 700℃ &lt; 적색 850℃ &lt; 휘적색 950℃ &lt; 황적색 1,100℃ &lt; 백적색 1,300℃</p>`, src:"1강 연소의 제반 사항" },
    { id:"1-4", title:"연소범위 · 위험도 · 폭굉", body:`
      <p>연소범위가 <b>넓고</b> 연소하한이 <b>낮을수록</b> 위험하다.</p>
      <div class="formula">위험도 = (연소상한 − 연소하한) ÷ 연소하한</div>
      <table><thead><tr><th>가스</th><th class="num">연소범위(%)</th></tr></thead><tbody>
      <tr><td>아세틸렌</td><td class="num">2.5 ~ 81.0</td></tr><tr><td>수소</td><td class="num">4.0 ~ 75.0</td></tr>
      <tr><td>가솔린</td><td class="num">1.4 ~ 7.6 <span class="check">교사 확인 필요</span></td></tr>
      <tr><td>벤젠</td><td class="num">1.2 ~ 7.8</td></tr><tr><td>톨루엔</td><td class="num">1.4 ~ 6.7</td></tr></tbody></table>
      <p><b>폭굉</b>: 화염 전파 속도가 음속보다 빠른 경우 (폭굉파 1,000~3,500m/s, 정상 연소파 0.1~10m/s)<br>
      폭굉 유도거리가 짧아지는 조건: 정상연소속도가 큰 혼합가스, 압력이 높을 때, 관 속 방해물·관 지름이 좁을 때, 점화원 에너지가 강할 때</p>`, src:"1강 연소범위·폭굉" },
    { id:"1-5", title:"소화의 원리 5가지", body:`
      <p>소화 = 연소의 요소 중 하나를 없애는 것.</p>
      <table><thead><tr><th>소화효과</th><th>없애는 것</th><th>내용</th></tr></thead><tbody>
      <tr><td>냉각소화</td><td>열</td><td>발화점 이하로 온도를 낮춤 (물: 기화잠열 539kcal/kg)</td></tr>
      <tr><td>질식소화</td><td>산소</td><td>산소 농도를 21% → 15% 이하로 (포, CO₂, 분말, 모래)</td></tr>
      <tr><td>제거소화</td><td>가연물</td><td>가연물을 연소 구역에서 제거</td></tr>
      <tr><td>희석소화</td><td>가연물 농도</td><td>가연성 기체를 연소하한 이하로 희석</td></tr>
      <tr><td>부촉매(억제)소화</td><td>연쇄반응</td><td>알칼리금속염, 암모늄염, 하론 1301·1211·2402</td></tr>
      </tbody></table>`, src:"1강 소화의 원리" },
    { id:"1-6", title:"소화약제", body:`
      <table><thead><tr><th>약제</th><th>핵심</th></tr></thead><tbody>
      <tr><td>물</td><td>기화잠열 539kcal/kg, 융해잠열 80kcal/kg, 비열 1kcal/kg·℃. 전기·금속분 화재 X. 봉상·적상·무상주수. 동결방지제: 에틸렌글리콜, 프로필렌글리콜, 글리세린, 탄산칼륨</td></tr>
      <tr><td>포</td><td>냉각·질식. 단백포(재연소 방지), 수성막포(유류화재 가장 우수), 내알코올포(수용성 액체)</td></tr>
      <tr><td>CO₂</td><td>비중 1.529, 승화점 −78.5℃, 심부화재 적합, 충전비 1.5 이상. 줄-톰슨 효과로 노즐이 막힐 수 있음</td></tr>
      <tr><td>할로겐화물</td><td>부촉매 효과. 소화능력 I &gt; Br &gt; Cl &gt; F. CCl₄는 공기·습기·CO₂와 반응해 맹독성 포스겐(COCl₂) 발생</td></tr>
      </tbody></table>
      <table><thead><tr><th>분말</th><th>주성분</th><th>착색</th><th>적응</th></tr></thead><tbody>
      <tr><td>제1종</td><td>NaHCO₃ 탄산수소나트륨</td><td>백색</td><td>B, C</td></tr>
      <tr><td>제2종</td><td>KHCO₃ 탄산수소칼륨</td><td>보라색(담자색) <span class="check">교사 확인 필요</span></td><td>B, C</td></tr>
      <tr><td>제3종</td><td>NH₄H₂PO₄ 제1인산암모늄</td><td>담홍색</td><td><b>A, B, C</b></td></tr>
      <tr><td>제4종</td><td>KHCO₃ + (NH₂)₂CO</td><td>회백색(회색) <span class="check">교사 확인 필요</span></td><td>B, C</td></tr>
      </tbody></table>`, src:"1강 소화제 · 2강 분말 소화기" },
    { id:"1-7", title:"화재의 종류", body:`
      <div class="firegrid">
        <div class="fg"><b>A급</b><span class="sw" style="background:#ffffff"></span><em>일반화재 · 백색</em><small>주수, 산·알칼리, 포</small></div>
        <div class="fg"><b>B급</b><span class="sw" style="background:#f2c230"></span><em>유류·가스 · 황색</em><small>화학포, 할로겐화물, CO₂, 분말</small></div>
        <div class="fg"><b>C급</b><span class="sw" style="background:#2f6fd1"></span><em>전기화재 · 청색</em><small>CO₂, 증발성 액체, 분말</small></div>
        <div class="fg"><b>D급</b><span class="sw sw-none"></span><em>금속분화재 · 색 없음</em><small>팽창질석, 팽창진주암, 건조사</small></div>
      </div>
      <p class="small">간이 소화용구: 마른모래, 팽창질석과 팽창진주암, 중조톱밥</p>`, src:"1강 화재의 종류" }
   ]},
 { id:2, title:"소화제 및 소화설비", sub:"소화기 · 할론 · 소요단위 · 소화설비 기준",
   concepts:[
    { id:"2-1", title:"소화기의 종류와 적응화재", body:`
      <table><thead><tr><th>소화기</th><th>약제</th><th>적응화재</th><th>소화효과</th></tr></thead><tbody>
      <tr><td>산·알칼리</td><td>H₂SO₄ + NaHCO₃</td><td>A <span class="check">교사 확인 필요</span></td><td>냉각</td></tr>
      <tr><td>강화액</td><td>물 + K₂CO₃ (pH 12 이상, 응고점 −30~−25℃)</td><td>A (무상이면 A·B·C)</td><td>냉각</td></tr>
      <tr><td>이산화탄소</td><td>CO₂</td><td>B, C</td><td>질식·냉각·피복</td></tr>
      <tr><td>할로겐화합물</td><td>하론 1301·1211·2402·1011, CCl₄</td><td>B, C</td><td>질식·냉각·부촉매</td></tr>
      <tr><td>분말</td><td>제1~4종</td><td>A, B, C</td><td>질식·냉각·부촉매</td></tr>
      <tr><td>포말</td><td>NaHCO₃ + Al₂(SO₄)₃</td><td>A, B</td><td>질식·냉각</td></tr>
      </tbody></table>
      <p class="small">포말 소화기는 전기·알코올류 화재에 사용하지 못하고, 동절기 동결에 주의한다.</p>`, src:"2강 수동식 소화기 종류" },
    { id:"2-2", title:"할론 소화약제", body:`
      <p>할론 번호는 <b>C · F · Cl · Br</b> 원자 수를 차례로 적은 것이다.</p>
      <table><thead><tr><th>번호</th><th>화학식</th><th>비고</th></tr></thead><tbody>
      <tr><td>1301</td><td>CF₃Br</td><td>소화효과 가장 큼, 독성 낮음</td></tr>
      <tr><td>1211</td><td>CF₂ClBr</td><td>BCF 소화기</td></tr>
      <tr><td>2402</td><td>C₂F₄Br₂</td><td>FB 소화기</td></tr>
      <tr><td>1011</td><td>CH₂ClBr</td><td>CB 소화기</td></tr>
      <tr><td>CCl₄</td><td>사염화탄소</td><td><b>사용 금지</b> · 포스겐(COCl₂) 발생</td></tr>
      </tbody></table>
      <div class="formula">소화효과: 1301 &gt; 1211 &gt; 2402 &gt; 1011 &gt; CCl₄</div>`, src:"2강 할로겐화물 소화기" },
    { id:"2-3", title:"CO₂ · 분말 소화기", body:`
      <table><thead><tr><th>구분</th><th>핵심</th></tr></thead><tbody>
      <tr><td>CO₂ 소화기</td><td>탄산가스 99.5% 이상, 수분 0.05% 이하(결빙으로 노즐 막힘 방지). 충전비 1.5 이상. 전기화재에 효과. 금속분 화재 X</td></tr>
      <tr><td>축압식 분말</td><td>용기 상부 N₂ 축압, 지시압력계 정상 <b>녹색</b>(비정상 황색·적색), 7.0~9.8kg/㎠</td></tr>
      <tr><td>제3종 분말</td><td>열분해 시 메타인산(HPO₃) 생성 → A·B·C급 모두 적용</td></tr>
      <tr><td>소화기 관리</td><td>높이 1.5m 이하, '소화기' 표시, 바람을 등지고 사용</td></tr>
      </tbody></table>`, src:"2강 분말·CO₂ 소화기" },
    { id:"2-4", title:"소화시설의 종류", body:`
      <table><thead><tr><th>설비</th><th>종류</th></tr></thead><tbody>
      <tr><td>소화설비</td><td>소화기구, 옥내소화전, 스프링클러, 옥외소화전</td></tr>
      <tr><td>경보설비</td><td>자동화재탐지설비, 비상경보설비, 확성장치, 비상방송설비</td></tr>
      <tr><td>피난설비</td><td>방열복, 공기호흡기, 인공소생기, 유도등, 유도표지, 비상조명등</td></tr>
      <tr><td>소화용수설비</td><td>상수도, 소화수조, 저수조</td></tr>
      <tr><td>소화활동설비</td><td>제연설비, 연결송수관설비, 연결살수설비, 비상콘센트설비</td></tr>
      </tbody></table>`, src:"2강 소화시설의 종류" },
    { id:"2-5", title:"소요단위와 능력단위", body:`
      <table><thead><tr><th>1소요단위</th><th>외벽 내화구조</th><th>외벽 비내화구조</th></tr></thead><tbody>
      <tr><td>제조소·취급소</td><td>연면적 100㎡</td><td>연면적 50㎡</td></tr>
      <tr><td>저장소</td><td>연면적 150㎡</td><td>연면적 75㎡</td></tr>
      <tr><td>위험물</td><td colspan="2">지정수량의 10배</td></tr></tbody></table>
      <table><thead><tr><th>간이 소화용구</th><th class="num">용량</th><th class="num">능력단위</th></tr></thead><tbody>
      <tr><td>소화전용 물통</td><td class="num">8L</td><td class="num">0.3</td></tr>
      <tr><td>수조(물통 3개 포함)</td><td class="num">80L</td><td class="num">1.5</td></tr>
      <tr><td>수조(물통 6개 포함)</td><td class="num">190L</td><td class="num">2.5</td></tr>
      <tr><td>마른 모래(삽 1개 포함)</td><td class="num">50L</td><td class="num">0.5</td></tr>
      <tr><td>팽창질석·팽창진주암</td><td class="num">160L</td><td class="num">1.0</td></tr></tbody></table>
      <p class="small">대형 소화기: A급 10단위 이상, B급 20단위 이상 · 배치 거리: 소형 20m 이내, 대형 30m 이내 · CO₂·할로겐(1301 제외) 소화기는 지하층·무창층·바닥면적 20㎡ 이하 장소에 설치 금지</p>`, src:"2강 소요단위·능력단위" },
    { id:"2-6", title:"소화설비 설치 기준", body:`
      <table><thead><tr><th>설비</th><th>수평거리</th><th>방사량</th><th>방사압력</th><th>수원의 양</th></tr></thead><tbody>
      <tr><td>옥내소화전</td><td>25m 이하</td><td>260L/min 이상</td><td>350kPa 이상</td><td>N(최대 5개) × 7.8㎥</td></tr>
      <tr><td>옥외소화전</td><td>40m 이하</td><td>450L/min 이상</td><td>350kPa 이상</td><td>N(최대 4개) × 13.5㎥</td></tr>
      </tbody></table>
      <ul><li>옥내소화전 비상전원 45분 이상, 개폐밸브·호스접속구 높이 1.5m 이하</li>
      <li>스프링클러: 부착장소 평상시 28℃ 미만 → 표시온도 58℃</li>
      <li>CO₂ 설비 저장용기 충전비: 저압식 1.1~1.4, 고압식 1.5~1.9</li>
      <li>분말 설비: 30초 이내 균일 방사</li>
      <li>불활성가스 IG-541 = N₂ 52% · Ar 40% · CO₂ 8%</li></ul>`, src:"2강 제조소 등의 소화설비 기준" }
   ]},
 { id:3, title:"소방시설 · 위험물 분류 · 제1·2류", sub:"경보·피난설비 · 유별 · 지정수량 · 혼재 · 산화성고체 · 가연성고체",
   concepts:[
    { id:"3-1", title:"경보 · 피난 · 소화활동설비", body:`
      <table><thead><tr><th>설비</th><th>핵심</th></tr></thead><tbody>
      <tr><td>경보설비</td><td>비상경보, 비상방송, 자동화재탐지, 누전경보기, 단독형감지기, 가스누설경보기, 통합감시시설</td></tr>
      <tr><td>자동화재탐지 경계구역</td><td>2개 건축물·2개 층에 걸치지 않음(500㎡ 이하는 가능), 면적 600㎡ 이하, 한 변 50m 이하</td></tr>
      <tr><td>인명구조기구</td><td>방열복, 공기호흡기, 인공소생기</td></tr>
      <tr><td>통로유도등</td><td>복도 높이 1m 이하·보행거리 20m, 거실 1.5m 이상, 계단 1m 이하</td></tr>
      <tr><td>소화활동설비</td><td>연결송수관, 연결살수, 비상콘센트, 무선통신보조, 제연설비</td></tr>
      </tbody></table>`, src:"3강 소방시설의 설치 및 운영" },
    { id:"3-2", title:"위험물의 유별", body:`
      <table><thead><tr><th>유별</th><th>성질</th><th>강의 암기 문구</th></tr></thead><tbody>
      <tr><td>제1류</td><td>산화성고체</td><td>무아과염 요부질 중과함께</td></tr>
      <tr><td>제2류</td><td>가연성고체</td><td>황유적 금마는 철인이다</td></tr>
      <tr><td>제3류</td><td>자연발화성 및 금수성물질</td><td>칼나알두개 황 금알有 칼알탄 금인수</td></tr>
      <tr><td>제4류</td><td>인화성액체</td><td>특 1 알코올 2 3 4 동식물</td></tr>
      <tr><td>제5류</td><td>자기반응성물질</td><td>오! 자기, 有 질 아니디히</td></tr>
      <tr><td>제6류</td><td>산화성액체</td><td>육산과질</td></tr></tbody></table>
      <p class="small">산화성: 제1류(고체)와 제6류(액체) · 지정수량 단위: 고체 kg, 액체 L · 지정수량이 작을수록 위험</p>`, src:"3강 위험물의 분류" },
    { id:"3-3", title:"지정수량 배수 환산", body:`
      <p>2가지 이상 위험물을 함께 저장하면 각각의 배수를 더한다.</p>
      <div class="formula">배수 = A 저장량 ÷ A 지정수량 + B 저장량 ÷ B 지정수량 + …</div>
      <table><tbody><tr><td>합계 1 이상</td><td>위험물 (위험물안전관리법)</td></tr><tr><td>합계 1 미만</td><td>소량위험물 (시·도 조례)</td></tr></tbody></table>
      <p class="small">예: 휘발유 400L(지정수량 200L) + 등유 1,000L(1,000L) = 2 + 1 = <b>3배</b></p>`, src:"3강 지정수량" },
    { id:"3-4", title:"혼재 가능 위험물", body:`
      <div class="formula">4-2-3 · 5-2-4 · 6-1</div>
      <div class="tbl-x"><table class="mix"><thead><tr><th></th><th>1류</th><th>2류</th><th>3류</th><th>4류</th><th>5류</th><th>6류</th></tr></thead><tbody>
      <tr><th>1류</th><td>-</td><td class="x">×</td><td class="x">×</td><td class="x">×</td><td class="x">×</td><td class="o">○</td></tr>
      <tr><th>2류</th><td class="x">×</td><td>-</td><td class="x">×</td><td class="o">○</td><td class="o">○</td><td class="x">×</td></tr>
      <tr><th>3류</th><td class="x">×</td><td class="x">×</td><td>-</td><td class="o">○</td><td class="x">×</td><td class="x">×</td></tr>
      <tr><th>4류</th><td class="x">×</td><td class="o">○</td><td class="o">○</td><td>-</td><td class="o">○</td><td class="x">×</td></tr>
      <tr><th>5류</th><td class="x">×</td><td class="o">○</td><td class="x">×</td><td class="o">○</td><td>-</td><td class="x">×</td></tr>
      <tr><th>6류</th><td class="o">○</td><td class="x">×</td><td class="x">×</td><td class="x">×</td><td class="x">×</td><td>-</td></tr>
      </tbody></table></div>`, src:"3강 혼합발화" },
    { id:"3-5", title:"제1류 산화성고체", body:`
      <p>자신은 <b>불연성</b>이지만 가열·충격으로 분해하며 <b>산소</b>를 내놓는다. 가연물·유기물과 섞이면 위험하다.</p>
      <table><thead><tr><th>지정수량</th><th>품명</th></tr></thead><tbody>
      <tr><td>50kg (위험등급 Ⅰ)</td><td>아염소산염류, 염소산염류, 과염소산염류, 무기과산화물</td></tr>
      <tr><td>300kg (Ⅱ)</td><td>브롬산염류, 질산염류, 요오드산염류</td></tr>
      <tr><td>1,000kg (Ⅲ)</td><td>과망간산염류, 중크롬산염류</td></tr></tbody></table>
      <ul><li>소화: 무기과산화물을 제외하고 다량의 물로 주수소화 · <b>무기과산화물은 건조분말·건조사로 질식소화</b></li>
      <li>저장: 가연물·직사광선·화기를 피해 환기 좋은 찬 곳, 조해성이 있어 습기 차단·밀폐, 무기과산화물은 물기엄금</li>
      <li>과산화나트륨 + 물 → 수산화나트륨 + 산소 + 열 · 과산화칼륨은 갈색 착색유리병에 밀전·밀봉</li>
      <li>질산칼륨 = 초석(흑색화약 원료), 질산나트륨 = 칠레초석, 과망간산칼륨 = 적자색 결정</li></ul>`, src:"3강 제1류 위험물" },
    { id:"3-6", title:"제2류 가연성고체", body:`
      <p>낮은 온도에서 불이 잘 붙는 <b>환원성</b> 고체. 산화제(제1류·제6류)와 섞이지 않게 한다.</p>
      <table><thead><tr><th>지정수량</th><th>품명</th></tr></thead><tbody>
      <tr><td>100kg</td><td>황화린, 적린, 유황</td></tr>
      <tr><td>500kg</td><td>철분, 마그네슘, 금속분류</td></tr>
      <tr><td>1,000kg</td><td>인화성고체 (고형알코올 등, 1기압에서 인화점 40℃ 미만인 고체)</td></tr></tbody></table>
      <ul><li>소화: 적린·유황은 물로 냉각소화 · <b>철분·마그네슘·금속분은 건조사로 질식소화</b>(주수하면 수소 발생)</li>
      <li>황화린은 물과 반응해 유독한 황화수소(H₂S) 발생 · 유황은 푸른 불꽃을 내며 아황산가스(SO₂) 발생</li>
      <li>알루미늄 분 + 물(수증기) → 수소 발생 · 마그네슘 + 강산 → 수소 발생</li></ul>`, src:"3강 제2류 위험물" }
   ]},
 { id:4, title:"제3 · 4 · 5 · 6류 위험물", sub:"자연발화성·금수성 · 인화성액체 · 자기반응성 · 산화성액체",
   concepts:[
    { id:"4-1", title:"제3류 자연발화성 및 금수성물질", body:`
      <p>황린을 제외하고 모두 <b>물과 반응해 가연성 가스</b>를 낸다.</p>
      <table><thead><tr><th>지정수량</th><th>품명</th></tr></thead><tbody>
      <tr><td>10kg</td><td>칼륨, 나트륨, 알킬알루미늄, 알킬리튬</td></tr>
      <tr><td>20kg</td><td>황린</td></tr>
      <tr><td>50kg</td><td>알칼리금속·알칼리토금속, 유기금속화합물</td></tr>
      <tr><td>300kg</td><td>금속의 수소화물, 금속의 인화물, 칼슘 또는 알루미늄의 탄화물</td></tr></tbody></table>
      <ul><li>칼륨·나트륨: <b>석유(등유·경유·유동파라핀) 속</b> 저장 · CO₂와도 폭발적으로 반응</li>
      <li>황린: 물과 반응하지 않아 <b>pH 9 정도의 약알칼리성 물속</b> 저장 (강알칼리면 포스핀 발생)</li>
      <li>알킬알루미늄: 완전 밀봉, 용기 상부는 불연성 가스 봉입</li>
      <li>탄화칼슘 + 물 → 아세틸렌 · 인화칼슘 + 물 → 포스핀</li>
      <li>소화: 마른모래, 팽창질석·팽창진주암, 탄산수소염류 분말</li></ul>`, src:"4강 제3류 위험물" },
    { id:"4-2", title:"제4류 인화성액체 품명과 지정수량", body:`
      <table><thead><tr><th>품명</th><th class="num">비수용성</th><th class="num">수용성</th><th>대표 물질</th></tr></thead><tbody>
      <tr><td>특수인화물</td><td class="num" colspan="2">50L</td><td>디에틸에테르, 이황화탄소, 산화프로필렌, 아세트알데히드</td></tr>
      <tr><td>제1석유류</td><td class="num">200L</td><td class="num">400L</td><td>휘발유, 벤젠, 톨루엔 / 아세톤</td></tr>
      <tr><td>알코올류</td><td class="num" colspan="2">400L</td><td>메탄올, 에탄올</td></tr>
      <tr><td>제2석유류</td><td class="num">1,000L</td><td class="num">2,000L</td><td>등유, 경유 / 초산(아세트산), 의산</td></tr>
      <tr><td>제3석유류</td><td class="num">2,000L</td><td class="num">4,000L</td><td>중유, 크레오소트유 / 에틸렌글리콜, 글리세린</td></tr>
      <tr><td>제4석유류</td><td class="num" colspan="2">6,000L</td><td>윤활유(기어유, 실린더유)</td></tr>
      <tr><td>동식물유류</td><td class="num" colspan="2">10,000L</td><td>아마인유, 들기름(건성유)</td></tr></tbody></table>
      <p class="small">소화: 주수소화는 화재면을 확대시켜 절대 금지 · 대량은 포 질식소화 · 수용성은 포 또는 다량의 물로 희석</p>`, src:"4강 제4류 위험물" },
    { id:"4-3", title:"제4류 주요 물질과 함정 포인트", body:`
      <ul><li><b>디에틸에테르</b>: 인화점 −45℃, 공기와 오래 접촉하면 과산화물 생성(검출 KI 10% → 황색, 제거 황산제일철)</li>
      <li><b>이황화탄소</b>: 발화점 100℃, 탱크는 <b>물속</b>에 저장(가연성 증기 억제)</li>
      <li><b>산화프로필렌·아세트알데히드</b>: 구리·은·수은·마그네슘 용기 금지, 불연성 가스 봉입</li>
      <li><b>크실렌</b>: o-크실렌은 제1석유류, m-·p-크실렌은 제2석유류</li>
      <li><b>알코올류</b> 조건: 탄소 3개 이내, 포화, 1가 알코올, 60vol% 이상 · 에틸렌글리콜(2가)·글리세린(3가)은 제3석유류</li>
      <li><b>동식물유류</b>: 요오드값 130 이상 건성유(아마인유·들기름 → 자연발화 위험), 100~130 반건성유, 100 미만 불건성유
        <span class="check">강의자료의 "요오드값이 클수록 포화지방산이 많다"는 불포화지방산으로 교사 확인 필요</span></li></ul>`, src:"4강 제4류 위험물의 종류" },
    { id:"4-4", title:"제5류 자기반응성물질", body:`
      <p>가연물이면서 자체에 산소를 가지고 있어 외부 산소 없이도 가열·충격으로 연소·폭발한다.</p>
      <table><thead><tr><th>지정수량</th><th>품명</th></tr></thead><tbody>
      <tr><td>10kg</td><td>유기과산화물, 질산에스테르류</td></tr>
      <tr><td>200kg</td><td>니트로화합물(TNT, 피크린산)</td></tr></tbody></table>
      <ul><li>소화: <b>질식소화는 효과가 없고, 다량의 물로 냉각소화</b></li>
      <li>니트로셀룰로오스: 물 또는 알코올로 습면, 안정제를 넣어 냉암소 저장 · 니트로글리세린을 규조토에 흡수시킨 것이 다이나마이트</li>
      <li>운반용기 표시: 화기엄금 및 충격주의</li></ul>`, src:"4강 제5류 위험물" },
    { id:"4-5", title:"제6류 산화성액체", body:`
      <table><thead><tr><th>품명 (모두 300kg)</th><th>핵심</th></tr></thead><tbody>
      <tr><td>과염소산</td><td>가열하면 유독성 염화수소(HCl) 발생</td></tr>
      <tr><td>과산화수소</td><td><b>36중량% 이상</b>만 위험물 (3%는 소독약), 갈색병·구멍 뚫린 마개</td></tr>
      <tr><td>질산</td><td><b>비중 1.49 이상</b>만 위험물, 가열·분해 시 NO₂ 발생, 부식성</td></tr></tbody></table>
      <p class="small">소화: 원칙적으로 주수소화 금지, CO₂·할로겐화물 소화기는 사용하지 않음 · 질산은 소량이면 주수, 다량이면 포·CO₂·마른모래
      <span class="check">강의자료 안에서 CO₂ 사용 여부가 다르게 적혀 있어 교사 확인 필요</span></p>`, src:"4강 제6류 위험물" }
   ]},
 { id:5, title:"위험물 취급방법과 안전관리법", sub:"제조소 · 저장소 · 취급소 · 운반 기준 · 위험등급",
   concepts:[
    { id:"5-1", title:"제조소의 안전거리와 보유공지", body:`
      <table><thead><tr><th>대상</th><th class="num">안전거리</th></tr></thead><tbody>
      <tr><td>사용전압 7,000V 초과 35,000V 이하</td><td class="num">3m 이상</td></tr>
      <tr><td>사용전압 35,000V 초과</td><td class="num">5m 이상</td></tr>
      <tr><td>주거용</td><td class="num">10m 이상</td></tr>
      <tr><td>고압가스, 액화석유가스, 도시가스</td><td class="num">20m 이상</td></tr>
      <tr><td>학교 · 병원 · 극장</td><td class="num">30m 이상</td></tr>
      <tr><td>유형문화재, 지정문화재</td><td class="num">50m 이상</td></tr></tbody></table>
      <p>보유공지: 지정수량 10배 이하 <b>3m 이상</b>, 10배 초과 <b>5m 이상</b></p>`, src:"5강 제조소의 위치·구조" },
    { id:"5-2", title:"표지와 게시판", body:`
      <div class="signs">
        <div class="sign s-white">위험물 제조소<small>표지 · 백색 바탕 흑색 문자</small></div>
        <div class="sign s-red">화기엄금<small>2류 인화성고체, 3류 자연발화성, 4류, 5류</small></div>
        <div class="sign s-red">화기주의<small>2류(인화성고체 제외)</small></div>
        <div class="sign s-blue">물기엄금<small>1류 알칼리금속 과산화물, 3류 금수성</small></div>
        <div class="sign s-black">위험물<small>이동탱크 · 흑색 바탕 황색 반사도료</small></div>
        <div class="sign s-yellow">주유중 엔진정지<small>주유취급소 · 황색 바탕 흑색 문자</small></div>
      </div>
      <p class="small">크기 0.6m × 0.3m 이상 · 암기: <b>게나소나 백흑</b>(표지·게시판 백색 바탕 흑색 문자), <b>화적 수청 백</b>(화기 적색, 물기 청색, 문자 백색), <b>주엔황흑</b></p>`, src:"5강 표지 및 게시판" },
    { id:"5-3", title:"제조소의 설비", body:`
      <ul><li>환기: 자연배기 방식, 급기구는 바닥면적 150㎡마다 1개 이상, 크기 800㎠ 이상</li>
      <li>배출능력: 1시간당 배출장소 용적의 20배 이상</li>
      <li>옥외설비 바닥: 둘레에 0.15m 턱, 최저부에 집유설비</li>
      <li>정전기 제거: 접지, 공기 중 상대습도 70% 이상, 공기 이온화, 제전기</li>
      <li>피뢰설비: 지정수량 10배 이상 취급 제조소</li></ul>`, src:"5강 제조소 기타설비" },
    { id:"5-4", title:"저장소와 탱크", body:`
      <table><thead><tr><th>구분</th><th>기준</th></tr></thead><tbody>
      <tr><td>옥외탱크 보유공지</td><td>지정수량 500배 이하 3m 이상, 500배 초과~1,000배 이하 5m 이상</td></tr>
      <tr><td>방유제 용량</td><td>탱크 용량의 <b>110% 이상</b> (2기 이상이면 최대 탱크 용량의 110% 이상)</td></tr>
      <tr><td>방유제와 탱크 거리</td><td>탱크 지름 15m 미만: 탱크 높이의 1/3 이상, 15m 이상: 1/2 이상</td></tr>
      <tr><td>아세트알데히드 등 탱크</td><td>냉각·보냉장치, 불활성 기체 봉입, 동·마그네슘·은·수은 사용 금지</td></tr>
      <tr><td>지정과산화물 옥내저장소</td><td>150㎡ 이내마다 격벽, 창은 바닥에서 2m 이상·창 하나 0.4㎡ 이하</td></tr>
      </tbody></table>`, src:"5강 위험물 저장소" },
    { id:"5-5", title:"운반 기준", body:`
      <table><thead><tr><th>구분</th><th>기준</th></tr></thead><tbody>
      <tr><td>고체 수납률</td><td>운반용기 내용적의 95% 이하</td></tr>
      <tr><td>액체 수납률</td><td>98% 이하 (55℃에서 새지 않도록 공간용적 유지)</td></tr>
      <tr><td>알킬알루미늄 등</td><td>90% 이하, 50℃에서 5% 이상 공간용적</td></tr>
      <tr><td>차광성 피복</td><td>제1류, 제3류(자연발화성), 제4류(특수인화물), 제5류, 제6류</td></tr>
      <tr><td>방수성 피복</td><td>제1류(알칼리금속 과산화물), 제2류(철분·금속분·마그네슘), 제3류(금수성)</td></tr>
      </tbody></table>
      <table><thead><tr><th>유별</th><th>운반용기 주의사항</th></tr></thead><tbody>
      <tr><td>제1류</td><td>화기·충격주의, 가연물접촉주의 (알칼리금속 과산화물은 + 물기엄금)</td></tr>
      <tr><td>제2류</td><td>화기주의 (철분·금속분·마그네슘은 + 물기엄금, 인화성고체는 화기엄금)</td></tr>
      <tr><td>제3류</td><td>자연발화성: 화기엄금 및 공기접촉엄금 / 금수성: 물기엄금</td></tr>
      <tr><td>제4류</td><td>화기엄금</td></tr><tr><td>제5류</td><td>화기엄금 및 충격주의</td></tr><tr><td>제6류</td><td>가연물접촉주의</td></tr>
      </tbody></table>`, src:"5강 위험물의 운반에 관한 기준" },
    { id:"5-6", title:"위험등급", body:`
      <table><thead><tr><th>등급</th><th>해당 위험물</th></tr></thead><tbody>
      <tr><td>Ⅰ</td><td>1류 지정수량 50kg · 3류 칼륨·나트륨·알킬알루미늄·알킬리튬·황린 · 4류 특수인화물 · 5류 지정수량 10kg · 6류 전부</td></tr>
      <tr><td>Ⅱ</td><td>1류 300kg · 2류 황화린·적린·유황 · 3류 알칼리금속(K·Na 제외)·알칼리토금속·유기금속화합물 · 4류 제1석유류·알코올류 · 5류 Ⅰ 외</td></tr>
      <tr><td>Ⅲ</td><td>Ⅰ, Ⅱ에 해당하지 않는 것</td></tr></tbody></table>`, src:"5강 위험물의 위험등급" },
    { id:"5-7", title:"위험물 안전관리법 주요 조항", body:`
      <ul><li>위험물: 인화성 또는 발화성 등의 성질을 가지는 것으로서 대통령령이 정하는 물품</li>
      <li>품명·수량·지정수량 배수 변경: 변경하려는 날의 <b>7일 전까지</b> 시·도지사에게 신고</li>
      <li>예방규정 제출 대상: 지정수량 10배 이상 제조소, 100배 이상 옥외저장소, 150배 이상 옥내저장소, 200배 이상 옥외탱크저장소, 암반탱크저장소, 이송취급소</li>
      <li>경보설비: 지정수량 100배 이상 옥내저장소는 자동화재탐지설비</li></ul>`, src:"5강 위험물 안전관리법" }
   ]}
];

DATA.CASES = [
 { lec:1, title:"목공소 걸레 더미 화재", place:"산업 현장",

  table:{head:["게시판","바탕","문자"],rows:[["위험물 제조소(표지)","백색","흑색"],["화기엄금","적색","백색"],["화기주의","적색","백색"],["물기엄금","청색","백색"],["주유중 엔진정지","황색","흑색"],["이동탱크 '위험물'","흑색","황색"]]}},

  {q:"제2류 황화린·적린·유황 위험등급",a:"Ⅱ",alt:["2","II"]},{q:"제1류 지정수량 300kg 위험등급",a:"Ⅱ",alt:["2","II"]},{q:"제3류 황린 위험등급",a:"Ⅰ",alt:["1","I"]},{q:"제4류 제2석유류 위험등급",a:"Ⅲ",alt:["3","III"]}]}

<script>
/* =====================================================================
   위험물기능사 학습실 - 관리자 페이지
   비밀번호는 이 파일에 없습니다. 입력값은 Apps Script로 보내 확인합니다.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.documentElement.style.setProperty("--accent",ADMIN.ACCENT);
const L=DATA.LECTURES,Q=DATA.QUESTIONS,C=DATA.CASES,M=DATA.MEMO;
const QBY=Object.fromEntries(Q.map(q=>[q.id,q]));
let RAW=null,SHEET="",tab="sum",F={from:"",to:"",prefix:"",lec:""},sel=null,lastTable=null;
const pc=(a,b)=>b?Math.round(a/b*100):null, P=v=>v==null?"-":v+"%";
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+ +y,0)/a.length):null;
const ss=(k,v)=>{try{v===undefined?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}};
const sg=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};

/* ---------- 로그인 ---------- */
async function fetchData(key){
  const r=await fetch(ADMIN.SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"admin",key})});
  return r.json();
}
function loginView(msg){
  $("#who").innerHTML="";
  $("#main").innerHTML=`<div class="start card"><span class="eyebrow">관리자 전용</span><h1 style="font-size:1.5rem">${esc(ADMIN.TITLE)} 관리</h1>
   ${ADMIN.SCRIPT_URL?`<p class="muted">Apps Script의 스크립트 속성에 저장한 관리자 비밀번호를 입력하세요. 비밀번호는 이 페이지에 저장되지 않으며, 탭을 닫으면 다시 입력해야 합니다.</p>
   <div id="lf" class="field"><label for="pw">관리자 비밀번호</label><input id="pw" class="input" type="password" autocomplete="current-password">
   <span class="err" id="lerr">${esc(msg||"")}</span><button class="btn" type="button" id="lgo">확인</button></div>`
   :`<p class="verdict bad"><b class="v">기록 저장 주소가 설정되지 않았습니다</b><span>admin.html 위쪽 ADMIN 설정의 SCRIPT_URL에 Apps Script 웹 앱 주소를 넣어 주세요. (설치 안내 3단계)</span></p>`}</div>`;
  const f=$("#lf");if(!f)return;$("#pw").focus();
  const go=async()=>{const k=$("#pw").value;if(!k)return;$("#lerr").textContent="확인 중…";await login(k);};$("#lgo").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();go();}};
}
async function login(k){
  try{const d=await fetchData(k);
    if(!d.ok){ss("hzss:admin");loginView(d.error==="auth"?"비밀번호가 맞지 않습니다.":"서버 오류: "+(d.error||""));return;}
    ss("hzss:admin",k);RAW=d.tables;SHEET=d.sheetUrl||"";render();
  }catch(e){loginView("서버에 연결하지 못했습니다. 주소와 배포 설정(액세스: 모든 사용자)을 확인하세요.");}
}
function logout(){ss("hzss:admin");RAW=null;loginView();}

/* ---------- 필터 ---------- */
const COL={개념:{lec:2},기출:{lec:2},강완료:{lec:2},셀프테스트:{memo:2},사고사례:{lec:2},모의고사:{}};
function rows(type){
  return (RAW[type]||[]).filter(r=>{
    const d=String(r[0]).slice(0,10);
    if(F.from&&d<F.from)return false;if(F.to&&d>F.to)return false;
    if(F.prefix&&!String(r[1]).startsWith(F.prefix))return false;
    if(F.lec){if(COL[type].lec!=null&&String(r[COL[type].lec])!==F.lec)return false;
      if(COL[type].memo!=null){const m=M.find(x=>x.id===r[2]);if(m&&String(m.lec)!==F.lec)return false;}}
    return true;});
}
const students=()=>{const s=new Map();Object.keys(COL).forEach(t=>rows(t).forEach(r=>{const p=s.get(r[1]);if(!p||r[0]>p)s.set(r[1],r[0]);}));return s;};

/* ---------- 화면 ---------- */
const TABS=[["sum","요약"],["lec","강별 현황"],["q","문항별 정답률"],["memo","암기 숙련도"],["case","사고 사례"],["stu","학습자"],["share","학습자 접속 QR"]];
function render(){
  $("#who").innerHTML=`${SHEET?`<a class="icon-btn" href="${esc(SHEET)}" target="_blank" rel="noopener">구글 시트 열기</a>`:""}<button class="icon-btn" id="reload">새로고침</button><button class="icon-btn" id="out">로그아웃</button>`;
  $("#reload").onclick=async()=>{toast("불러오는 중…");await login(sg("hzss:admin"));toast("최신 기록을 불러왔습니다");};
  $("#out").onclick=logout;
  $("#main").innerHTML=`<div class="page-h"><span class="eyebrow">관리자</span><h1>${esc(ADMIN.TITLE)} 학습 현황</h1></div>
   <div class="card"><div class="filters">
    <label>시작일<input type="date" class="input" id="f-from" value="${F.from}"></label>
    <label>종료일<input type="date" class="input" id="f-to" value="${F.to}"></label>
    <label>학번 앞자리<input class="input mono" id="f-prefix" value="${esc(F.prefix)}" placeholder="예: 302" inputmode="numeric"></label>
    <label>강<select class="input" id="f-lec"><option value="">전체</option>${L.map(l=>`<option value="${l.id}" ${F.lec==l.id?"selected":""}>${l.id}강</option>`).join("")}</select></label>
    <button class="btn plain sm" id="f-clear">필터 지우기</button></div></div>
   <div class="steps" role="tablist">${TABS.map(([k,t])=>`<button data-t="${k}" aria-current="${tab===k}">${t}</button>`).join("")}</div>
   <div id="pane"></div>`;
  ["from","to","prefix","lec"].forEach(k=>{$("#f-"+k).addEventListener(k==="prefix"?"input":"change",e=>{F[k]=e.target.value.trim();pane();});});
  $("#f-clear").onclick=()=>{F={from:"",to:"",prefix:"",lec:""};render();};
  $(".steps").onclick=e=>{const b=e.target.closest("[data-t]");if(b){tab=b.dataset.t;sel=null;render();}};
  pane();
}
function table(title,head,body,opts={}){
  lastTable={title,head,body:body.map(r=>r.map(c=>typeof c==="object"&&c?c.v:c))};
  return `<div class="card"><div class="spread"><h2>${esc(title)}</h2><button class="btn plain sm" id="csv">CSV 내려받기</button></div>
   ${opts.note?`<p class="small">${opts.note}</p>`:""}
   <div class="tbl-x"><table class="adm"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
   <tbody>${body.length?body.map((r,i)=>`<tr ${opts.rowAttr?opts.rowAttr(i):""}>${r.map(c=>{if(c&&typeof c==="object")return `<td class="${c.cls||""}">${c.h??esc(c.v)}</td>`;return `<td>${esc(c)}</td>`}).join("")}</tr>`).join("")
     :`<tr><td colspan="${head.length}" class="small">조건에 맞는 기록이 없습니다.</td></tr>`}</tbody></table></div></div>`;
}
const low=v=>({v:P(v),cls:v!=null&&v<60?"lowv":"num"});
function pane(){
  const el=$("#pane");lastTable=null;
  const S=students();
  if(tab==="sum"){
    const qa=rows("기출"),mk=rows("모의고사"),cs=rows("사고사례"),st=rows("셀프테스트");
    const week=new Date(Date.now()-7*864e5).toISOString();
    const active=[...S.values()].filter(t=>t>=week).length;
    const lecAcc=L.map(l=>{const r=qa.filter(x=>x[2]==l.id);return{l,v:pc(r.filter(x=>x[5]==="O").length,r.length),n:r.length}});
    const weak=lecAcc.filter(x=>x.v!=null).sort((a,b)=>a.v-b.v)[0];
    const qs=qStats().filter(x=>x.n>=3).sort((a,b)=>a.acc-b.acc).slice(0,3);
    el.innerHTML=`<div class="card"><div class="stats">
      <div class="stat"><small>학습자</small><b>${S.size}</b></div><div class="stat"><small>최근 7일 활동</small><b>${active}</b></div>
      <div class="stat"><small>기출 풀이</small><b>${qa.length}</b></div></div><div class="stats">
      <div class="stat"><small>기출 정답률</small><b>${P(pc(qa.filter(x=>x[5]==="O").length,qa.length))}</b></div>
      <div class="stat"><small>모의고사 평균</small><b>${mk.length?avg(mk.map(x=>x[2]))+"점":"-"}</b></div>
      <div class="stat"><small>셀프 테스트</small><b>${st.length}회</b></div></div></div>
     <div class="card"><h2>강별 기출 정답률</h2>${lecAcc.map(x=>`<div class="lecrow"><span>${x.l.id}강 <span class="small">${esc(x.l.title.slice(0,10))}</span></span><div class="bar ${x.v!=null&&x.v>=60?"ok":""}"><i style="width:${x.v||0}%;${x.v!=null&&x.v<60?"background:var(--bad)":""}"></i></div><span class="num">${P(x.v)}</span></div>`).join("")}
      <p class="small">정답률 60% 미만은 빨간색으로 표시합니다.</p></div>
     <div class="card"><h2>지도 포인트</h2><div class="qlist">
      ${weak?`<div class="qitem" style="grid-template-columns:1fr"><span><b>가장 약한 강: ${weak.l.id}강 ${esc(weak.l.title)}</b> · 정답률 ${weak.v}% (${weak.n}회 풀이)</span></div>`:""}
      ${qs.map(x=>`<div class="qitem" style="grid-template-columns:auto 1fr auto"><span class="mono">${x.q.id}</span><span>${esc(x.q.q)}<br><span class="small">많이 고른 오답: ${x.top?`${"①②③④"[x.top-1]} ${esc(x.q.opts[x.top-1])}`:"-"}</span></span><b class="lowv">${x.acc}%</b></div>`).join("")}
      ${cs.length?`<div class="qitem" style="grid-template-columns:1fr"><span>사고 원인 찾기 정답률 ${P(pc(cs.filter(x=>x[3]==="O").length,cs.length))} · ${cs.length}회 시도</span></div>`:""}
      ${!weak&&!qs.length&&!cs.length?`<p class="small">아직 기록이 없습니다.</p>`:""}</div></div>`;
    return;
  }
  if(tab==="lec"){
    const body=L.map(l=>{const id=String(l.id);
      const con=rows("개념").filter(r=>r[2]===id),qa=rows("기출").filter(r=>r[2]===id),done=rows("강완료").filter(r=>r[2]===id),cs=rows("사고사례").filter(r=>r[2]===id);
      const who=new Set([...con,...qa,...done,...cs].map(r=>r[1]));
      return [`${l.id}강 ${l.title}`,who.size,new Set(con.map(r=>r[1]+r[3])).size,qa.length,low(pc(qa.filter(r=>r[5]==="O").length,qa.length)),done.length?avg(done.map(r=>r[3])):"-",low(pc(cs.filter(r=>r[3]==="O").length,cs.length))];});
    el.innerHTML=table("강별 현황",["강","학습자","개념 열람(학습자×개념)","기출 풀이","기출 정답률","강 문제 평균점수","사고 사례 정답률"],body,{note:"60% 미만은 빨간색입니다. 강 문제 평균점수는 강별 5문항을 끝까지 푼 결과입니다."});
  }
  if(tab==="q"){
    const body=qStats().sort((a,b)=>(a.acc??101)-(b.acc??101)).map(x=>[x.q.id,x.q.q,`${"①②③④"[x.q.ans]} ${x.q.opts[x.q.ans]}`,x.n,low(x.acc),x.top?`${"①②③④"[x.top-1]} ${x.q.opts[x.top-1]} (${x.topN}명)`:"-"]);
    el.innerHTML=table("문항별 정답률",["문항","문제","정답","풀이 수","정답률","가장 많이 고른 오답"],body,{note:"정답률이 낮은 순서입니다. 많이 고른 오답은 수업에서 짚어 줄 오개념입니다."});
  }
  if(tab==="memo"){
    const r=rows("셀프테스트");
    const body=M.filter(m=>!F.lec||String(m.lec)===F.lec).map(m=>{const t=r.filter(x=>x[2]===m.id);const last=new Map();t.forEach(x=>{const p=last.get(x[1]);if(!p||x[0]>p[0])last.set(x[1],x)});
      const wc={};t.forEach(x=>String(x[5]).split(" / ").filter(Boolean).forEach(w=>wc[w]=(wc[w]||0)+1));const top=Object.entries(wc).sort((a,b)=>b[1]-a[1])[0];
      return [`${m.lec}강`,m.title,t.length,last.size,t.length?avg(t.map(x=>x[4]))+"점":"-",low(last.size?avg([...last.values()].map(x=>x[6])):null),top?`${top[0]} (${top[1]}회)`:"-"];});
    el.innerHTML=table("암기 숙련도",["강","암기 자료","테스트 횟수","학습자","평균 점수","평균 숙련도(최근)","가장 많이 틀린 항목"],body);
  }
  if(tab==="case"){
    const r=rows("사고사례");
    const body=C.filter(c=>!F.lec||String(c.lec)===F.lec).map(c=>{const t=r.filter(x=>x[2]==c.lec);const ok=t.filter(x=>x[3]==="O");
      return [`${c.lec}강`,c.title,t.length,new Set(t.map(x=>x[1])).size,low(pc(ok.length,t.length)),t.length?(t.reduce((s,x)=>s+ +x[4],0)/t.length).toFixed(1):"-",ok.length?avg(ok.map(x=>x[5])):"-"];});
    el.innerHTML=table("사고 원인 찾기",["강","사례","시도","학습자","정답률","평균 단서 수","정답 평균 점수"],body,{note:"단서를 적게 보고 맞힐수록 점수가 높습니다(100·80·60·40점)."});
  }
  if(tab==="stu"){
    const list=[...S.entries()].sort((a,b)=>a[0].localeCompare(b[0],"ko",{numeric:true}));
    const body=list.map(([id,t])=>{const qa=latestAns(id);const v=Object.values(qa);const mk=rows("모의고사").filter(r=>r[1]===id);
      return [{v:id,h:`<button class="link mono" data-stu="${esc(id)}">${esc(id)}</button>`},(()=>{const d=new Date(t);return isNaN(d)?t:d.toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})})(),new Set(rows("개념").filter(r=>r[1]===id).map(r=>r[3])).size,v.length,low(pc(v.filter(x=>x==="O").length,v.length)),mk.length?Math.max(...mk.map(r=>+r[2])):"-",rows("셀프테스트").filter(r=>r[1]===id).length,rows("사고사례").filter(r=>r[1]===id&&r[3]==="O").map(r=>r[2]).filter((x,i,a)=>a.indexOf(x)===i).length+"/5"];});
    el.innerHTML=table("학습자 목록",["학번","최근 활동","본 개념","푼 문항","정답률(최근 답)","모의고사 최고","셀프 테스트","사고 사례 해결"],body,{note:"학번을 누르면 개인 기록을 볼 수 있습니다. 정답률은 문항별 가장 최근 답 기준입니다."})+`<div id="detail"></div>`;
    el.onclick=e=>{const b=e.target.closest("[data-stu]");if(b){sel=b.dataset.stu;detail();}};
    if(sel)detail();
  }
  if(tab==="share"){
    const url=ADMIN.LEARNER_URL;
    let svg="";if(url){const q=qrcode(0,"M");q.addData(url);q.make();svg=q.createSvgTag({cellSize:8,margin:2,scalable:true});}
    el.innerHTML=`<div class="card"><h2>학습자 접속 QR</h2>${url?`<div class="qrwrap">${svg}</div><p class="mono" style="word-break:break-all">${esc(url)}</p>
      <div class="row"><button class="btn" id="copy">주소 복사</button><button class="btn plain" onclick="print()">인쇄</button></div>`
      :`<p class="muted">admin.html 위쪽 ADMIN 설정의 LEARNER_URL에 학습자 페이지 주소(예: https://아이디.github.io/저장소/)를 넣으면 QR이 나타납니다.</p>`}</div>`;
    const cp=$("#copy");if(cp)cp.onclick=()=>{navigator.clipboard?.writeText(url).then(()=>toast("주소를 복사했습니다"),()=>toast("복사하지 못했습니다"))};
  }
  const csv=$("#csv");if(csv)csv.onclick=downloadCSV;
}
function qStats(){const r=rows("기출");return Q.filter(q=>!F.lec||String(q.lec)===F.lec).map(q=>{const t=r.filter(x=>x[3]===q.id);const wc={};t.filter(x=>x[5]!=="O").forEach(x=>wc[x[4]]=(wc[x[4]]||0)+1);
  const top=Object.entries(wc).sort((a,b)=>b[1]-a[1])[0];return{q,n:t.length,acc:pc(t.filter(x=>x[5]==="O").length,t.length),top:top?+top[0]:null,topN:top?top[1]:0};});}
function latestAns(id){const o={};rows("기출").filter(r=>r[1]===id).sort((a,b)=>a[0]<b[0]?-1:1).forEach(r=>o[r[3]]=r[5]);return o;}
function detail(){
  const id=sel,qa=latestAns(id);
  const wrong=Object.entries(qa).filter(([,v])=>v==="X").map(([k])=>QBY[k]).filter(Boolean);
  const memo=new Map();rows("셀프테스트").filter(r=>r[1]===id).forEach(r=>{const p=memo.get(r[2]);if(!p||r[0]>p[0])memo.set(r[2],r)});
  const cases=rows("사고사례").filter(r=>r[1]===id);const mk=rows("모의고사").filter(r=>r[1]===id);
  $("#detail").innerHTML=`<div class="card"><div class="spread"><h2>${esc(id)} 개인 기록</h2><button class="btn plain sm" id="dclose">닫기</button></div>
   ${L.map(l=>{const ks=Object.keys(qa).filter(k=>QBY[k]&&QBY[k].lec===l.id);const v=pc(ks.filter(k=>qa[k]==="O").length,ks.length);
     return `<div class="lecrow"><span>${l.id}강</span><div class="bar ${v!=null&&v>=60?"ok":""}"><i style="width:${v||0}%;${v!=null&&v<60?"background:var(--bad)":""}"></i></div><span class="num">${ks.length?`${P(v)} (${ks.length})`:"-"}</span></div>`}).join("")}
   <h3>지금 틀린 상태인 문항 ${wrong.length}개</h3>${wrong.length?`<div class="qlist">${wrong.map(q=>`<div class="qitem" style="grid-template-columns:auto 1fr"><span class="mono">${q.id}</span><span>${esc(q.q)}</span></div>`).join("")}</div>`:`<p class="small">없음</p>`}
   <h3>암기 숙련도(최근)</h3>${memo.size?`<div class="qlist">${[...memo.values()].map(r=>`<div class="qitem" style="grid-template-columns:1fr auto"><span>${esc(r[3])}</span><b class="${+r[6]<60?"lowv":""}">${esc(r[6])}%</b></div>`).join("")}</div>`:`<p class="small">셀프 테스트 기록 없음</p>`}
   <p class="small">사고 사례 시도 ${cases.length}회 · 정답 ${cases.filter(r=>r[3]==="O").length}회 · 모의고사 ${mk.length}회${mk.length?` (최고 ${Math.max(...mk.map(r=>+r[2]))}점)`:""}</p></div>`;
  $("#dclose").onclick=()=>{sel=null;$("#detail").innerHTML="";};
  $("#detail").scrollIntoView({behavior:"smooth",block:"start"});
}
function downloadCSV(){
  if(!lastTable)return;const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv="﻿"+[lastTable.head,...lastTable.body].map(r=>r.map(q).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`${lastTable.title}_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
let tt;function toast(t){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1800);}

$("#brand-title").textContent=ADMIN.TITLE+" 관리";document.title=ADMIN.TITLE+" 관리";
const saved=sg("hzss:admin");if(saved&&ADMIN.SCRIPT_URL)login(saved);else loginView();

</script>
