<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>위험물기능사 학습실</title>
<meta name="description" content="사고 사례, 핵심 개념, 기출 유형 문제, 암기 도구로 위험물기능사 필기를 혼자 공부하는 학습 페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: 좁은 본문 칼럼 + 상단(데스크톱)/하단(모바일) 메뉴. 중립 회색 지면, 남색 강조 하나, 안전표지 색은 법정 색 */
:root{
  --accent:#1F3A5F; --accent-ink:#ffffff; --accent-soft:#e8edf4;
  --bg:#f4f5f7; --surface:#ffffff; --ink:#1b2430; --muted:#5d6775; --line:#dde1e7; --line-strong:#c4cad3;
  --ok:#1d7a46; --ok-soft:#e5f3eb; --bad:#c0392b; --bad-soft:#fbe9e7; --warn:#b5650a; --warn-soft:#fcf1e2;
  --sign-red:#d32f2f; --sign-blue:#1f4fa3; --sign-yellow:#f4c20d; --sign-black:#111111;
  --shadow:0 1px 2px rgba(27,36,48,.05),0 4px 14px rgba(27,36,48,.05);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#8fb3e3; --accent-ink:#0e1621; --accent-soft:#1e2a3a;
  --bg:#12161c; --surface:#1a2029; --ink:#e7eaee; --muted:#9aa3ae; --line:#2b333e; --line-strong:#3a4452;
  --ok:#5fc98d; --ok-soft:#173225; --bad:#ef8576; --bad-soft:#3a1d1a; --warn:#eab162; --warn-soft:#3a2b14;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:#8fb3e3; --accent-ink:#0e1621; --accent-soft:#1e2a3a;
  --bg:#12161c; --surface:#1a2029; --ink:#e7eaee; --muted:#9aa3ae; --line:#2b333e; --line-strong:#3a4452;
  --ok:#5fc98d; --ok-soft:#173225; --bad:#ef8576; --bad-soft:#3a1d1a; --warn:#eab162; --warn-soft:#3a2b14;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html{font-size:var(--fs,100%)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:.875rem;color:var(--muted)}
.muted{color:var(--muted)}
b{font-weight:700}

/* 상단바 */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:.75rem;color:var(--muted)}
.who{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.who .mono{color:var(--ink);font-weight:600}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:.8rem}
.nav{display:flex;gap:2px;max-width:960px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.nav button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:.92rem;color:var(--muted);border-bottom:3px solid transparent}
.nav button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.bnav{display:none}
@media (max-width:720px){
  .nav{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .bnav button{border:0;background:none;padding:6px 2px;font-size:.72rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
  .bnav button svg{width:22px;height:22px}
  .bnav button[aria-current="true"]{color:var(--accent)}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
}

/* 본문 */
.main{max-width:960px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.page-h{display:flex;flex-direction:column;gap:4px}
.page-h h1{font-size:1.5rem}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:1.2rem}
.card h3{font-size:1.02rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 18px;font-weight:700;font-size:.95rem;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.plain{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.gray{background:var(--bg);color:var(--muted)}
.check{display:inline-block;font-size:.7rem;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:0 6px;border-radius:4px;margin-left:4px;font-family:var(--f-body);vertical-align:1px}

/* 진행 막대 */
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok i{background:var(--ok)}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat small{font-size:.75rem;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* 학번 화면 */
.start{max-width:460px;margin:8vh auto 0;width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.input{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:11px 14px;font-size:1.05rem;width:100%;min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}

/* 강 카드 */
.lec{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lec:hover{border-color:var(--accent)}
.lec .no{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:600}
.lec h3{font-size:1.05rem}
.lec .sub{font-size:.82rem;color:var(--muted)}
.lec .m{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.75rem;color:var(--muted)}
.lec .m b{display:block;font-family:var(--f-mono);font-size:.95rem;color:var(--ink)}

/* 사고 사례 */
.case-scene{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.case-meta{display:flex;gap:6px;flex-wrap:wrap}
.clues{display:flex;flex-direction:column;gap:8px;counter-reset:c}
.clue{border:1px dashed var(--line-strong);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.clue .k{font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--accent);flex:none;padding-top:2px}
.clue.locked{background:var(--bg);color:var(--muted)}
.clue.locked button{margin-left:auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;min-height:48px}
.opt .n{font-family:var(--f-mono);font-weight:700;color:var(--muted);flex:none}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .n{color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .n{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .n{color:var(--bad)}
.opt:disabled{cursor:default}
.opt .why{display:block;font-size:.85rem;color:var(--muted);margin-top:4px}
.verdict{border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--bad-soft)}
.verdict b.v{font-size:1.05rem}
.verdict.ok b.v{color:var(--ok)} .verdict.bad b.v{color:var(--bad)}
.explain{display:grid;gap:8px}
.explain div{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:.92rem}
.explain div b{color:var(--muted);font-size:.82rem;padding-top:1px}

/* 강 페이지 */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem;color:var(--muted)}
.steps button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.concept-nav{display:flex;gap:6px;flex-wrap:wrap}
.concept-nav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:.8rem;color:var(--muted)}
.concept-nav button.seen{border-color:var(--line-strong);color:var(--ink)}
.concept-nav button[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.concept table{border-collapse:collapse;width:100%;font-size:.92rem}
.concept th,.concept td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.concept thead th{background:var(--bg);font-size:.82rem;color:var(--muted)}
.concept td.num{text-align:right;white-space:nowrap}
.concept ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.concept .body{display:flex;flex-direction:column;gap:12px;overflow-x:auto}
.formula{font-family:var(--f-mono);background:var(--accent-soft);color:var(--accent);padding:10px 14px;border-radius:8px;font-weight:600;font-size:.95rem}
.src{font-size:.78rem;color:var(--muted)}
.tbl-x{overflow-x:auto}
table.mix{width:auto}
table.mix th,table.mix td{text-align:center;min-width:44px}
table.mix td.o{color:var(--ok);font-weight:700;background:var(--ok-soft)} table.mix td.x{color:var(--bad)}
.firegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fg{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.fg b{font-family:var(--f-mono);font-size:1.3rem}
.fg em{font-style:normal;font-weight:600;font-size:.88rem}
.fg small{font-size:.78rem;color:var(--muted)}
.sw{width:36px;height:12px;border-radius:99px;border:1px solid var(--line-strong)}
.sw-none{background:repeating-linear-gradient(45deg,transparent 0 3px,var(--line-strong) 3px 4px)}
@media (max-width:620px){.firegrid{grid-template-columns:repeat(2,1fr)}}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sign{border-radius:4px;padding:14px 8px;text-align:center;font-weight:800;font-size:1.05rem;letter-spacing:.04em;display:flex;flex-direction:column;gap:6px;border:1px solid #00000022}
.sign small{font-weight:500;font-size:.7rem;letter-spacing:0;line-height:1.3}
.s-white{background:#ffffff;color:#111111}.s-red{background:var(--sign-red);color:#ffffff}.s-blue{background:var(--sign-blue);color:#ffffff}
.s-yellow{background:var(--sign-yellow);color:#111111}.s-black{background:var(--sign-black);color:var(--sign-yellow)}

/* 문제 */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.04em}
.qtimer{margin-left:auto;font-family:var(--f-mono);font-weight:700}
.qtimer.low{color:var(--bad)}
.qtext{font-size:1.15rem;font-weight:700}
.result-big{font-family:var(--f-mono);font-size:2.6rem;font-weight:700;line-height:1}
.result-big small{font-size:1.1rem;color:var(--muted)}
.qlist{display:flex;flex-direction:column;gap:6px}
.qitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.qitem .mono{font-size:.8rem;color:var(--muted)}

/* 암기 */
.tools{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tools button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tools button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.flash{perspective:1000px;border:0;background:none;padding:0;width:100%;height:200px}
.flash .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash[aria-pressed="true"] .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:var(--r);border:1px solid var(--line-strong);text-align:center}
.flash .f{background:var(--surface);font-size:1.25rem;font-weight:700}
.flash .b{background:var(--accent-soft);color:var(--accent);transform:rotateY(180deg);font-size:1.3rem;font-weight:700}
.flash small{font-size:.75rem;font-weight:500;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.flash .in{transition:none}}
.fill table{border-collapse:collapse;font-size:.92rem}
.fill th,.fill td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.fill thead th{background:var(--bg);color:var(--muted);font-size:.8rem}
.fill td.h{font-weight:600;text-align:left;white-space:nowrap}
.fill input{width:100%;min-width:72px;border:1px solid var(--line-strong);border-radius:6px;padding:6px;text-align:center;background:var(--bg)}
.fill td.ok input,.fill td.ok .tg{border-color:var(--ok);background:var(--ok-soft)}
.fill td.bad input,.fill td.bad .tg{border-color:var(--bad);background:var(--bad-soft)}
.fill .tg{width:40px;height:34px;border:1px dashed var(--line-strong);border-radius:6px;background:var(--bg);font-weight:700}
.fill td .ans{display:block;font-size:.72rem;color:var(--bad)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;min-height:46px}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.mi.no{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mi.no{animation:none}}
.mnemo{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.mnemo b{font-size:1.15rem;color:var(--accent)}
.memo-set{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer}
.memo-set:hover{border-color:var(--accent)}
.mast{font-family:var(--f-mono);font-weight:700;font-size:.9rem}
.answer-row{display:flex;gap:8px}
.answer-row .input{flex:1}

/* 현황 */
.lecrow{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;font-size:.9rem}
.lecrow .num{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:50;max-width:calc(100vw - 32px)}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sync{font-size:.75rem;color:var(--muted)}

.icon-btn{white-space:nowrap}
@media (max-width:420px){.who>span:first-child{display:none}}

[hidden]{display:none!important}
.brand-btn{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.brand-btn b{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.brand-btn:hover b{color:var(--accent)}
.fontctl{display:flex;gap:4px}
.fontctl .icon-btn{min-width:40px;font-weight:700}
.fontctl .pm{font-size:.95em;margin-left:1px}
@media (max-width:420px){.brand-btn b{font-size:1.05rem}.fontctl .icon-btn{min-width:34px;padding:5px 6px}.top-in{gap:8px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand brand-btn" data-act="home" aria-label="강별 학습으로 가기"><b id="brand-title">위험물기능사 학습실</b><small id="brand-org"></small></button>
    <div class="who" id="who"></div>
    <div class="fontctl" role="group" aria-label="글자 크기"><button class="icon-btn" data-act="font-down" aria-label="글자 작게">가<span class="pm">−</span></button><button class="icon-btn" data-act="font-up" aria-label="글자 크게">가<span class="pm">+</span></button></div>
  </div>
  <nav class="nav" id="nav" aria-label="주 메뉴" hidden></nav>
</header>
<main class="main" id="main" tabindex="-1"></main>
<nav class="bnav" id="bnav" aria-label="주 메뉴" hidden></nav>
<script>
/* ================== 설정 (교사가 바꾸는 곳) ================== */
const CONFIG = {
  TITLE: "위험물기능사 학습실",   // 앱 이름
  ORG: "",                            // 학교·회사 이름 (비워 두면 표시 안 함)
  ID_LABEL: "학번",                   // 산업체라면 "사번", 연수라면 "수강번호"
  ID_PLACEHOLDER: "예: 30215",
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzuEN_1d2IkJt1A7tndq5FMun4ruAzSu2MkOaWsDa_q719wZkMnkGD17Z6ubYbM9CW6zg/exec",                     // Apps Script 웹 앱 주소 (…/exec). 비워 두면 기록을 보내지 않음

 { id:1, title:"화재예방과 소화방법", sub:"연소 이론 · 소화 원리 · 소화약제 · 화재 종류",
   concepts:[
    { id:"1-1", title:"연소의 3요소와 4요소", body:`
      <p>불이 나려면 <b>가연물 · 산소공급원 · 점화원</b> 세 가지가 모두 있어야 한다. 여기에 <b>연쇄반응</b>을 더하면 연소의 4요소다.</p>
      <table><thead><tr><th>요소</th><th>핵심</th></tr></thead><tbody>
      <tr><td>가연물</td><td>열전도율이 <b>낮고</b>, 활성화 에너지가 <b>작고</b>, 표면적이 <b>넓을수록</b> 잘 탄다</td></tr>
      <tr><td>가연물이 될 수 없는 것</td><td>CO₂·H₂O(더 이상 산소와 반응 안 함), 18족 원소(He·Ne·Ar), 질소·질소산화물(흡열 반응)</td></tr>
      <tr><td>산소공급원</td><td>공기(산소), 제1류·제5류·제6류 위험물, 할로겐 분자(F₂·Cl₂·Br₂·I₂)</td></tr>
      <tr><td>점화원</td><td>활성화 에너지를 주는 것(노출된 불꽃 등). <b>기화열은 점화원이 될 수 없다</b></td></tr>
      </tbody></table>`, src:"1강 연소의 3요소" },
    { id:"1-2", title:"연소의 형태", body:`
      <p>같은 고체라도 타는 방식이 다르다. 시험에서는 <b>물질 → 연소 형태</b>를 묻는다.</p>
      <table><thead><tr><th>상태</th><th>연소 형태</th><th>대표 물질</th></tr></thead><tbody>
      <tr><td>기체</td><td>확산연소</td><td>수소, 아세틸렌</td></tr>
      <tr><td>액체</td><td>증발연소</td><td>알코올, 에테르, 석유, 아세톤</td></tr>
      <tr><td rowspan="4">고체</td><td>표면연소</td><td>목탄, 코크스, 금속분</td></tr>
      <tr><td>분해연소</td><td>석탄, 종이, 목재, 플라스틱</td></tr>
      <tr><td>증발연소</td><td>나프탈렌, 장뇌, 유황, 양초(파라핀)</td></tr>
      <tr><td>자기연소</td><td>제5류 위험물(니트로글리세린, 니트로셀룰로오스, 질산에스테르류)</td></tr>
      </tbody></table>`, src:"1강 연소의 형태" },
    { id:"1-3", title:"인화점 · 착화점 · 연소점과 자연발화", body:`
      <table><thead><tr><th>용어</th><th>뜻</th></tr></thead><tbody>
      <tr><td>인화점</td><td>점화원을 접촉시켰을 때 불이 붙는 최저온도</td></tr>
      <tr><td>착화점(발화점)</td><td>점화원 없이 축적된 열만으로 연소를 일으키는 최저온도</td></tr>
      <tr><td>연소점</td><td>점화원을 제거해도 계속 타는 온도 (인화점보다 약 10℃ 높음)</td></tr>
      </tbody></table>
      <p><b>자연발화</b>: 상온에서 저절로 열이 쌓여 발화하는 현상</p>
      <table><thead><tr><th>원인</th><th>대표 물질</th></tr></thead><tbody>
      <tr><td>산화열</td><td>석탄, 건성유, 고무분말</td></tr>
      <tr><td>분해열</td><td>셀룰로이드, 니트로셀룰로오스</td></tr>
      <tr><td>흡착열</td><td>목탄분말, 활성탄</td></tr>
      <tr><td>미생물</td><td>퇴비</td></tr></tbody></table>
      <p class="small">고온체 색: 암적색 700℃ &lt; 적색 850℃ &lt; 휘적색 950℃ &lt; 황적색 1,100℃ &lt; 백적색 1,300℃</p>`, src:"1강 연소의 제반 사항" },
    { id:"1-4", title:"연소범위 · 위험도 · 폭굉", body:`
      <p>연소범위가 <b>넓고</b> 연소하한이 <b>낮을수록</b> 위험하다.</p>
      <div class="formula">위험도 = (연소상한 − 연소하한) ÷ 연소하한</div>
      <table><thead><tr><th>가스</th><th class="num">연소범위(%)</th></tr></thead><tbody>
      <tr><td>아세틸렌</td><td class="num">2.5 ~ 81.0</td></tr><tr><td>수소</td><td class="num">4.0 ~ 75.0</td></tr>
      <tr><td>가솔린</td><td class="num">1.4 ~ 7.6 <span class="check">교사 확인 필요</span></td></tr>
      <tr><td>벤젠</td><td class="num">1.2 ~ 7.8</td></tr><tr><td>톨루엔</td><td class="num">1.4 ~ 6.7</td></tr></tbody></table>
      <p><b>폭굉</b>: 화염 전파 속도가 음속보다 빠른 경우 (폭굉파 1,000~3,500m/s, 정상 연소파 0.1~10m/s)<br>
      폭굉 유도거리가 짧아지는 조건: 정상연소속도가 큰 혼합가스, 압력이 높을 때, 관 속 방해물·관 지름이 좁을 때, 점화원 에너지가 강할 때</p>`, src:"1강 연소범위·폭굉" },
    { id:"1-5", title:"소화의 원리 5가지", body:`
      <p>소화 = 연소의 요소 중 하나를 없애는 것.</p>
      <table><thead><tr><th>소화효과</th><th>없애는 것</th><th>내용</th></tr></thead><tbody>
      <tr><td>냉각소화</td><td>열</td><td>발화점 이하로 온도를 낮춤 (물: 기화잠열 539kcal/kg)</td></tr>
      <tr><td>질식소화</td><td>산소</td><td>산소 농도를 21% → 15% 이하로 (포, CO₂, 분말, 모래)</td></tr>
      <tr><td>제거소화</td><td>가연물</td><td>가연물을 연소 구역에서 제거</td></tr>
      <tr><td>희석소화</td><td>가연물 농도</td><td>가연성 기체를 연소하한 이하로 희석</td></tr>
      <tr><td>부촉매(억제)소화</td><td>연쇄반응</td><td>알칼리금속염, 암모늄염, 하론 1301·1211·2402</td></tr>
      </tbody></table>`, src:"1강 소화의 원리" },
    { id:"1-6", title:"소화약제", body:`
      <table><thead><tr><th>약제</th><th>핵심</th></tr></thead><tbody>
      <tr><td>물</td><td>기화잠열 539kcal/kg, 융해잠열 80kcal/kg, 비열 1kcal/kg·℃. 전기·금속분 화재 X. 봉상·적상·무상주수. 동결방지제: 에틸렌글리콜, 프로필렌글리콜, 글리세린, 탄산칼륨</td></tr>
      <tr><td>포</td><td>냉각·질식. 단백포(재연소 방지), 수성막포(유류화재 가장 우수), 내알코올포(수용성 액체)</td></tr>
      <tr><td>CO₂</td><td>비중 1.529, 승화점 −78.5℃, 심부화재 적합, 충전비 1.5 이상. 줄-톰슨 효과로 노즐이 막힐 수 있음</td></tr>
      <tr><td>할로겐화물</td><td>부촉매 효과. 소화능력 I &gt; Br &gt; Cl &gt; F. CCl₄는 공기·습기·CO₂와 반응해 맹독성 포스겐(COCl₂) 발생</td></tr>
      </tbody></table>
      <table><thead><tr><th>분말</th><th>주성분</th><th>착색</th><th>적응</th></tr></thead><tbody>
      <tr><td>제1종</td><td>NaHCO₃ 탄산수소나트륨</td><td>백색</td><td>B, C</td></tr>
      <tr><td>제2종</td><td>KHCO₃ 탄산수소칼륨</td><td>보라색(담자색) <span class="check">교사 확인 필요</span></td><td>B, C</td></tr>
      <tr><td>제3종</td><td>NH₄H₂PO₄ 제1인산암모늄</td><td>담홍색</td><td><b>A, B, C</b></td></tr>
      <tr><td>제4종</td><td>KHCO₃ + (NH₂)₂CO</td><td>회백색(회색) <span class="check">교사 확인 필요</span></td><td>B, C</td></tr>
      </tbody></table>`, src:"1강 소화제 · 2강 분말 소화기" },
    { id:"1-7", title:"화재의 종류", body:`

   ]},
 { id:2, title:"소화제 및 소화설비", sub:"소화기 · 할론 · 소요단위 · 소화설비 기준",
   concepts:[
    { id:"2-1", title:"소화기의 종류와 적응화재", body:`

      <tr><td>산·알칼리</td><td>H₂SO₄ + NaHCO₃</td><td>A <span class="check">교사 확인 필요</span></td><td>냉각</td></tr>
      <tr><td>강화액</td><td>물 + K₂CO₃ (pH 12 이상, 응고점 −30~−25℃)</td><td>A (무상이면 A·B·C)</td><td>냉각</td></tr>

      <tr><td>분말</td><td>제1~4종</td><td>A, B, C</td><td>질식·냉각·부촉매</td></tr>

      <p class="small">포말 소화기는 전기·알코올류 화재에 사용하지 못하고, 동절기 동결에 주의한다.</p>`, src:"2강 수동식 소화기 종류" },
    { id:"2-2", title:"할론 소화약제", body:`

      <table><thead><tr><th>번호</th><th>화학식</th><th>비고</th></tr></thead><tbody>
      <tr><td>1301</td><td>CF₃Br</td><td>소화효과 가장 큼, 독성 낮음</td></tr>
      <tr><td>1211</td><td>CF₂ClBr</td><td>BCF 소화기</td></tr>
      <tr><td>2402</td><td>C₂F₄Br₂</td><td>FB 소화기</td></tr>
      <tr><td>1011</td><td>CH₂ClBr</td><td>CB 소화기</td></tr>
      <tr><td>CCl₄</td><td>사염화탄소</td><td><b>사용 금지</b> · 포스겐(COCl₂) 발생</td></tr>
      </tbody></table>
      <div class="formula">소화효과: 1301 &gt; 1211 &gt; 2402 &gt; 1011 &gt; CCl₄</div>`, src:"2강 할로겐화물 소화기" },
    { id:"2-3", title:"CO₂ · 분말 소화기", body:`
      <table><thead><tr><th>구분</th><th>핵심</th></tr></thead><tbody>
      <tr><td>CO₂ 소화기</td><td>탄산가스 99.5% 이상, 수분 0.05% 이하(결빙으로 노즐 막힘 방지). 충전비 1.5 이상. 전기화재에 효과. 금속분 화재 X</td></tr>
      <tr><td>축압식 분말</td><td>용기 상부 N₂ 축압, 지시압력계 정상 <b>녹색</b>(비정상 황색·적색), 7.0~9.8kg/㎠</td></tr>
      <tr><td>제3종 분말</td><td>열분해 시 메타인산(HPO₃) 생성 → A·B·C급 모두 적용</td></tr>
      <tr><td>소화기 관리</td><td>높이 1.5m 이하, '소화기' 표시, 바람을 등지고 사용</td></tr>
      </tbody></table>`, src:"2강 분말·CO₂ 소화기" },
    { id:"2-4", title:"소화시설의 종류", body:`
      <table><thead><tr><th>설비</th><th>종류</th></tr></thead><tbody>
      <tr><td>소화설비</td><td>소화기구, 옥내소화전, 스프링클러, 옥외소화전</td></tr>
      <tr><td>경보설비</td><td>자동화재탐지설비, 비상경보설비, 확성장치, 비상방송설비</td></tr>
      <tr><td>피난설비</td><td>방열복, 공기호흡기, 인공소생기, 유도등, 유도표지, 비상조명등</td></tr>
      <tr><td>소화용수설비</td><td>상수도, 소화수조, 저수조</td></tr>

      </tbody></table>`, src:"2강 소화시설의 종류" },
    { id:"2-5", title:"소요단위와 능력단위", body:`
      <table><thead><tr><th>1소요단위</th><th>외벽 내화구조</th><th>외벽 비내화구조</th></tr></thead><tbody>

    { id:"2-6", title:"소화설비 설치 기준", body:`
      <table><thead><tr><th>설비</th><th>수평거리</th><th>방사량</th><th>방사압력</th><th>수원의 양</th></tr></thead><tbody>
      <tr><td>옥내소화전</td><td>25m 이하</td><td>260L/min 이상</td><td>350kPa 이상</td><td>N(최대 5개) × 7.8㎥</td></tr>
      <tr><td>옥외소화전</td><td>40m 이하</td><td>450L/min 이상</td><td>350kPa 이상</td><td>N(최대 4개) × 13.5㎥</td></tr>
      </tbody></table>
      <ul><li>옥내소화전 비상전원 45분 이상, 개폐밸브·호스접속구 높이 1.5m 이하</li>
      <li>스프링클러: 부착장소 평상시 28℃ 미만 → 표시온도 58℃</li>
      <li>CO₂ 설비 저장용기 충전비: 저압식 1.1~1.4, 고압식 1.5~1.9</li>
      <li>분말 설비: 30초 이내 균일 방사</li>
      <li>불활성가스 IG-541 = N₂ 52% · Ar 40% · CO₂ 8%</li></ul>`, src:"2강 제조소 등의 소화설비 기준" }
   ]},
 { id:3, title:"소방시설 · 위험물 분류 · 제1·2류", sub:"경보·피난설비 · 유별 · 지정수량 · 혼재 · 산화성고체 · 가연성고체",
   concepts:[
    { id:"3-1", title:"경보 · 피난 · 소화활동설비", body:`
      <table><thead><tr><th>설비</th><th>핵심</th></tr></thead><tbody>
      <tr><td>경보설비</td><td>비상경보, 비상방송, 자동화재탐지, 누전경보기, 단독형감지기, 가스누설경보기, 통합감시시설</td></tr>
      <tr><td>자동화재탐지 경계구역</td><td>2개 건축물·2개 층에 걸치지 않음(500㎡ 이하는 가능), 면적 600㎡ 이하, 한 변 50m 이하</td></tr>
      <tr><td>인명구조기구</td><td>방열복, 공기호흡기, 인공소생기</td></tr>
      <tr><td>통로유도등</td><td>복도 높이 1m 이하·보행거리 20m, 거실 1.5m 이상, 계단 1m 이하</td></tr>
      <tr><td>소화활동설비</td><td>연결송수관, 연결살수, 비상콘센트, 무선통신보조, 제연설비</td></tr>
      </tbody></table>`, src:"3강 소방시설의 설치 및 운영" },
    { id:"3-2", title:"위험물의 유별", body:`
      <table><thead><tr><th>유별</th><th>성질</th><th>강의 암기 문구</th></tr></thead><tbody>
      <tr><td>제1류</td><td>산화성고체</td><td>무아과염 요부질 중과함께</td></tr>
      <tr><td>제2류</td><td>가연성고체</td><td>황유적 금마는 철인이다</td></tr>
      <tr><td>제3류</td><td>자연발화성 및 금수성물질</td><td>칼나알두개 황 금알有 칼알탄 금인수</td></tr>
      <tr><td>제4류</td><td>인화성액체</td><td>특 1 알코올 2 3 4 동식물</td></tr>
      <tr><td>제5류</td><td>자기반응성물질</td><td>오! 자기, 有 질 아니디히</td></tr>
      <tr><td>제6류</td><td>산화성액체</td><td>육산과질</td></tr></tbody></table>
      <p class="small">산화성: 제1류(고체)와 제6류(액체) · 지정수량 단위: 고체 kg, 액체 L · 지정수량이 작을수록 위험</p>`, src:"3강 위험물의 분류" },
    { id:"3-3", title:"지정수량 배수 환산", body:`
      <p>2가지 이상 위험물을 함께 저장하면 각각의 배수를 더한다.</p>
      <div class="formula">배수 = A 저장량 ÷ A 지정수량 + B 저장량 ÷ B 지정수량 + …</div>
      <table><tbody><tr><td>합계 1 이상</td><td>위험물 (위험물안전관리법)</td></tr><tr><td>합계 1 미만</td><td>소량위험물 (시·도 조례)</td></tr></tbody></table>
      <p class="small">예: 휘발유 400L(지정수량 200L) + 등유 1,000L(1,000L) = 2 + 1 = <b>3배</b></p>`, src:"3강 지정수량" },
    { id:"3-4", title:"혼재 가능 위험물", body:`
      <div class="formula">4-2-3 · 5-2-4 · 6-1</div>
      <div class="tbl-x"><table class="mix"><thead><tr><th></th><th>1류</th><th>2류</th><th>3류</th><th>4류</th><th>5류</th><th>6류</th></tr></thead><tbody>
      <tr><th>1류</th><td>-</td><td class="x">×</td><td class="x">×</td><td class="x">×</td><td class="x">×</td><td class="o">○</td></tr>
      <tr><th>2류</th><td class="x">×</td><td>-</td><td class="x">×</td><td class="o">○</td><td class="o">○</td><td class="x">×</td></tr>
      <tr><th>3류</th><td class="x">×</td><td class="x">×</td><td>-</td><td class="o">○</td><td class="x">×</td><td class="x">×</td></tr>
      <tr><th>4류</th><td class="x">×</td><td class="o">○</td><td class="o">○</td><td>-</td><td class="o">○</td><td class="x">×</td></tr>
      <tr><th>5류</th><td class="x">×</td><td class="o">○</td><td class="x">×</td><td class="o">○</td><td>-</td><td class="x">×</td></tr>
      <tr><th>6류</th><td class="o">○</td><td class="x">×</td><td class="x">×</td><td class="x">×</td><td class="x">×</td><td>-</td></tr>
      </tbody></table></div>`, src:"3강 혼합발화" },
    { id:"3-5", title:"제1류 산화성고체", body:`
      <p>자신은 <b>불연성</b>이지만 가열·충격으로 분해하며 <b>산소</b>를 내놓는다. 가연물·유기물과 섞이면 위험하다.</p>
      <table><thead><tr><th>지정수량</th><th>품명</th></tr></thead><tbody>
      <tr><td>50kg (위험등급 Ⅰ)</td><td>아염소산염류, 염소산염류, 과염소산염류, 무기과산화물</td></tr>
      <tr><td>300kg (Ⅱ)</td><td>브롬산염류, 질산염류, 요오드산염류</td></tr>
      <tr><td>1,000kg (Ⅲ)</td><td>과망간산염류, 중크롬산염류</td></tr></tbody></table>
      <ul><li>소화: 무기과산화물을 제외하고 다량의 물로 주수소화 · <b>무기과산화물은 건조분말·건조사로 질식소화</b></li>
      <li>저장: 가연물·직사광선·화기를 피해 환기 좋은 찬 곳, 조해성이 있어 습기 차단·밀폐, 무기과산화물은 물기엄금</li>
      <li>과산화나트륨 + 물 → 수산화나트륨 + 산소 + 열 · 과산화칼륨은 갈색 착색유리병에 밀전·밀봉</li>
      <li>질산칼륨 = 초석(흑색화약 원료), 질산나트륨 = 칠레초석, 과망간산칼륨 = 적자색 결정</li></ul>`, src:"3강 제1류 위험물" },
    { id:"3-6", title:"제2류 가연성고체", body:`
      <p>낮은 온도에서 불이 잘 붙는 <b>환원성</b> 고체. 산화제(제1류·제6류)와 섞이지 않게 한다.</p>
      <table><thead><tr><th>지정수량</th><th>품명</th></tr></thead><tbody>
      <tr><td>100kg</td><td>황화린, 적린, 유황</td></tr>
      <tr><td>500kg</td><td>철분, 마그네슘, 금속분류</td></tr>
      <tr><td>1,000kg</td><td>인화성고체 (고형알코올 등, 1기압에서 인화점 40℃ 미만인 고체)</td></tr></tbody></table>
      <ul><li>소화: 적린·유황은 물로 냉각소화 · <b>철분·마그네슘·금속분은 건조사로 질식소화</b>(주수하면 수소 발생)</li>
      <li>황화린은 물과 반응해 유독한 황화수소(H₂S) 발생 · 유황은 푸른 불꽃을 내며 아황산가스(SO₂) 발생</li>
      <li>알루미늄 분 + 물(수증기) → 수소 발생 · 마그네슘 + 강산 → 수소 발생</li></ul>`, src:"3강 제2류 위험물" }
   ]},
 { id:4, title:"제3 · 4 · 5 · 6류 위험물", sub:"자연발화성·금수성 · 인화성액체 · 자기반응성 · 산화성액체",
   concepts:[
    { id:"4-1", title:"제3류 자연발화성 및 금수성물질", body:`
      <p>황린을 제외하고 모두 <b>물과 반응해 가연성 가스</b>를 낸다.</p>
      <table><thead><tr><th>지정수량</th><th>품명</th></tr></thead><tbody>
      <tr><td>10kg</td><td>칼륨, 나트륨, 알킬알루미늄, 알킬리튬</td></tr>
      <tr><td>20kg</td><td>황린</td></tr>
      <tr><td>50kg</td><td>알칼리금속·알칼리토금속, 유기금속화합물</td></tr>
      <tr><td>300kg</td><td>금속의 수소화물, 금속의 인화물, 칼슘 또는 알루미늄의 탄화물</td></tr></tbody></table>
      <ul><li>칼륨·나트륨: <b>석유(등유·경유·유동파라핀) 속</b> 저장 · CO₂와도 폭발적으로 반응</li>
      <li>황린: 물과 반응하지 않아 <b>pH 9 정도의 약알칼리성 물속</b> 저장 (강알칼리면 포스핀 발생)</li>
      <li>알킬알루미늄: 완전 밀봉, 용기 상부는 불연성 가스 봉입</li>
      <li>탄화칼슘 + 물 → 아세틸렌 · 인화칼슘 + 물 → 포스핀</li>
      <li>소화: 마른모래, 팽창질석·팽창진주암, 탄산수소염류 분말</li></ul>`, src:"4강 제3류 위험물" },
    { id:"4-2", title:"제4류 인화성액체 품명과 지정수량", body:`
      <table><thead><tr><th>품명</th><th class="num">비수용성</th><th class="num">수용성</th><th>대표 물질</th></tr></thead><tbody>
      <tr><td>특수인화물</td><td class="num" colspan="2">50L</td><td>디에틸에테르, 이황화탄소, 산화프로필렌, 아세트알데히드</td></tr>
      <tr><td>제1석유류</td><td class="num">200L</td><td class="num">400L</td><td>휘발유, 벤젠, 톨루엔 / 아세톤</td></tr>
      <tr><td>알코올류</td><td class="num" colspan="2">400L</td><td>메탄올, 에탄올</td></tr>
      <tr><td>제2석유류</td><td class="num">1,000L</td><td class="num">2,000L</td><td>등유, 경유 / 초산(아세트산), 의산</td></tr>
      <tr><td>제3석유류</td><td class="num">2,000L</td><td class="num">4,000L</td><td>중유, 크레오소트유 / 에틸렌글리콜, 글리세린</td></tr>
      <tr><td>제4석유류</td><td class="num" colspan="2">6,000L</td><td>윤활유(기어유, 실린더유)</td></tr>
      <tr><td>동식물유류</td><td class="num" colspan="2">10,000L</td><td>아마인유, 들기름(건성유)</td></tr></tbody></table>
      <p class="small">소화: 주수소화는 화재면을 확대시켜 절대 금지 · 대량은 포 질식소화 · 수용성은 포 또는 다량의 물로 희석</p>`, src:"4강 제4류 위험물" },
    { id:"4-3", title:"제4류 주요 물질과 함정 포인트", body:`
      <ul><li><b>디에틸에테르</b>: 인화점 −45℃, 공기와 오래 접촉하면 과산화물 생성(검출 KI 10% → 황색, 제거 황산제일철)</li>
      <li><b>이황화탄소</b>: 발화점 100℃, 탱크는 <b>물속</b>에 저장(가연성 증기 억제)</li>
      <li><b>산화프로필렌·아세트알데히드</b>: 구리·은·수은·마그네슘 용기 금지, 불연성 가스 봉입</li>
      <li><b>크실렌</b>: o-크실렌은 제1석유류, m-·p-크실렌은 제2석유류</li>
      <li><b>알코올류</b> 조건: 탄소 3개 이내, 포화, 1가 알코올, 60vol% 이상 · 에틸렌글리콜(2가)·글리세린(3가)은 제3석유류</li>
      <li><b>동식물유류</b>: 요오드값 130 이상 건성유(아마인유·들기름 → 자연발화 위험), 100~130 반건성유, 100 미만 불건성유
        <span class="check">강의자료의 "요오드값이 클수록 포화지방산이 많다"는 불포화지방산으로 교사 확인 필요</span></li></ul>`, src:"4강 제4류 위험물의 종류" },
    { id:"4-4", title:"제5류 자기반응성물질", body:`
      <p>가연물이면서 자체에 산소를 가지고 있어 외부 산소 없이도 가열·충격으로 연소·폭발한다.</p>
      <table><thead><tr><th>지정수량</th><th>품명</th></tr></thead><tbody>
      <tr><td>10kg</td><td>유기과산화물, 질산에스테르류</td></tr>
      <tr><td>200kg</td><td>니트로화합물(TNT, 피크린산)</td></tr></tbody></table>
      <ul><li>소화: <b>질식소화는 효과가 없고, 다량의 물로 냉각소화</b></li>
      <li>니트로셀룰로오스: 물 또는 알코올로 습면, 안정제를 넣어 냉암소 저장 · 니트로글리세린을 규조토에 흡수시킨 것이 다이나마이트</li>
      <li>운반용기 표시: 화기엄금 및 충격주의</li></ul>`, src:"4강 제5류 위험물" },
    { id:"4-5", title:"제6류 산화성액체", body:`
      <table><thead><tr><th>품명 (모두 300kg)</th><th>핵심</th></tr></thead><tbody>
      <tr><td>과염소산</td><td>가열하면 유독성 염화수소(HCl) 발생</td></tr>
      <tr><td>과산화수소</td><td><b>36중량% 이상</b>만 위험물 (3%는 소독약), 갈색병·구멍 뚫린 마개</td></tr>
      <tr><td>질산</td><td><b>비중 1.49 이상</b>만 위험물, 가열·분해 시 NO₂ 발생, 부식성</td></tr></tbody></table>
      <p class="small">소화: 원칙적으로 주수소화 금지, CO₂·할로겐화물 소화기는 사용하지 않음 · 질산은 소량이면 주수, 다량이면 포·CO₂·마른모래
      <span class="check">강의자료 안에서 CO₂ 사용 여부가 다르게 적혀 있어 교사 확인 필요</span></p>`, src:"4강 제6류 위험물" }
   ]},
 { id:5, title:"위험물 취급방법과 안전관리법", sub:"제조소 · 저장소 · 취급소 · 운반 기준 · 위험등급",
   concepts:[
    { id:"5-1", title:"제조소의 안전거리와 보유공지", body:`
      <table><thead><tr><th>대상</th><th class="num">안전거리</th></tr></thead><tbody>
      <tr><td>사용전압 7,000V 초과 35,000V 이하</td><td class="num">3m 이상</td></tr>
      <tr><td>사용전압 35,000V 초과</td><td class="num">5m 이상</td></tr>

let queue=LS.get("hzss:queue",[]);
function send(type,row){
  if(!CONFIG.SCRIPT_URL) return;
  queue.push({type,row:[nowISO(),SID,...row]});LS.set("hzss:queue",queue);flush();
}
let flushing=false;
async function flush(){
  if(flushing||!queue.length||!CONFIG.SCRIPT_URL||!navigator.onLine) return;
  flushing=true;const batch=queue.slice(0,50);
  try{
    await fetch(CONFIG.SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"log",records:batch})});
    queue=queue.slice(batch.length);LS.set("hzss:queue",queue);
  }catch(e){}
  flushing=false;if(queue.length)setTimeout(flush,1500);
}
setInterval(flush,20000);addEventListener("online",flush);

/* ---------------- 계산 ---------------- */
const lecQs=id=>Q.filter(q=>q.lec===id);
function lecStats(id){
  const l=lecOf(id),qs=lecQs(id);
  const seen=l.concepts.filter(c=>S.seen[c.id]).length;
  const answered=qs.filter(q=>S.ans[q.id]);
  const correct=answered.filter(q=>S.ans[q.id].ok).length;
  const caseDone=S.cases[id]?1:0;
  const total=l.concepts.length+qs.length+1;
  const sets=M.filter(m=>m.lec===id&&S.memo[m.id]&&S.memo[m.id].mastery!=null);
  return{progress:Math.round((seen+answered.length+caseDone)/total*100),
    acc:answered.length?Math.round(correct/answered.length*100):null,
    mastery:sets.length?Math.round(sets.reduce((t,m)=>t+S.memo[m.id].mastery,0)/sets.length):null,
    seen,answered:answered.length,correct};
}
const pct=v=>v==null?"-":v+"%";

VIEWS.cases=()=>{

    <div class="grid">${C.map(c=>{const r=S.cases[c.lec];return `<button class="lec" data-case="${c.lec}">

const PTS=[100,80,60,40];
VIEWS.case=()=>{

    <div class="case-meta"><span class="chip">${esc(c.place)}</span>${done?`<span class="chip ${done.ok?"ok":"bad"}">이전 결과: ${done.ok?done.pts+"점":"오답"}</span>`:""}</div>
    <p class="case-scene">${esc(c.scene)}</p>
    <h3>단서</h3>
    <div class="clues">${c.clues.map((t,i)=>i<st.clues||st.checked?`<div class="clue"><span class="k">단서 ${i+1}</span><span>${esc(t)}</span></div>`
      :`<div class="clue locked"><span class="k">단서 ${i+1}</span><span>아직 열지 않았어요</span>${i===st.clues?`<button class="btn sm plain" data-clue>열기</button>`:""}</div>`).join("")}</div>
    <h3>${esc(c.q)} <span class="small">· 지금 맞히면 ${PTS[st.clues]}점</span></h3>
    <div class="opts">${c.opts.map((o,i)=>`<button class="opt ${st.checked?(i===c.ans?"right":(i===st.pick?"wrong":"")):""}" data-pick="${i}" aria-pressed="${st.pick===i}" ${st.checked?"disabled":""}><span class="n">${i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${st.checked?`<div class="verdict ${st.pick===c.ans?"ok":"bad"}"><b class="v">${st.pick===c.ans?`정답입니다 · ${PTS[st.clues]}점`:"아쉬워요. 정답을 확인해 보세요"}</b></div>
      <div class="explain"><div><b>사고 원인</b><span>${esc(c.cause)}</span></div><div><b>잘못된 점</b><span>${esc(c.wrong)}</span></div><div><b>올바른 대처</b><span>${esc(c.right)}</span></div></div>
      <div class="row"><button class="btn" data-golec>${c.lec}강 「${esc(lecOf(c.lec).concepts.find(x=>x.id===c.concept).title)}」 공부하기</button><button class="btn plain" data-other>다른 사례 보기</button></div>`
     :`<div class="row"><button class="btn" data-check ${st.pick==null?"disabled":""}>정답 확인</button><button class="btn plain" data-other>다른 사례 보기</button>${done?`<button class="link" data-golec>바로 학습으로</button>`:""}</div>`}
   </div>`;

    const p=e.target.closest("[data-pick]");if(p&&!st.checked){st.pick=+p.dataset.pick;render();return;}

  };
};

    const c=l.concepts[ci];
    body=`<div class="concept-nav">${l.concepts.map((x,i)=>`<button data-ci="${i}" class="${S.seen[x.id]?"seen":""}" aria-current="${i===ci}">${i+1}. ${esc(x.title)}</button>`).join("")}</div>

      <div class="row"><button class="btn ghost sm" data-cq="${c.id}">이 개념의 기출 문제 풀기</button><button class="btn ghost sm" data-cm>이 강 암기하기</button></div></article>
     <div class="spread"><button class="btn plain" data-ci="${ci-1}" ${ci===0?"disabled":""}>이전</button><span class="small mono">${ci+1} / ${l.concepts.length}</span>
      ${ci<l.concepts.length-1?`<button class="btn" data-ci="${ci+1}">다음</button>`:`<button class="btn" data-tab="quiz">기출 문제 풀기</button>`}</div>`;

      <div class="qlist">${qs.map((q,i)=>{const a=S.ans[q.id];return `<div class="qitem"><span class="mono">Q${i+1}</span><span>${esc(q.q)}</span>${a?`<span class="chip ${a.ok?"ok":"bad"}">${a.ok?"정답":"오답"}</span>`:`<span class="chip gray">안 풂</span>`}</div>`}).join("")}</div>

  }else if(tab==="memo"){

    body=`<div class="card"><h2>${l.id}강 암기 도구</h2><div class="qlist">${sets.map(memoRow).join("")}</div></div>`;

let QS=null,timerH=null;
function startQuiz(ids,mode,lec){QS={ids,mode,lec,i:0,pick:null,checked:false,res:{},start:Date.now(),limit:mode==="mock"?ids.length*60:0};go("quiz");}
VIEWS.quiz=()=>{
  clearInterval(timerH);
  if(!QS){go("quizhub");return;}

/* ---------------- 내 학습 현황 ---------------- */
VIEWS.me=()=>{
  const st=L.map(l=>({l,s:lecStats(l.id)}));
  const answered=Object.keys(S.ans).length,correct=Object.values(S.ans).filter(a=>a.ok).length;
  const weakLec=st.filter(x=>x.s.acc!=null).sort((a,b)=>a.s.acc-b.s.acc)[0]||st.sort((a,b)=>a.s.progress-b.s.progress)[0];
  const tested=M.filter(m=>S.memo[m.id]&&S.memo[m.id].mastery!=null).sort((a,b)=>S.memo[a.id].mastery-S.memo[b.id].mastery);
  const weakMemo=tested[0]||M.find(m=>!S.memo[m.id]||S.memo[m.id].mastery==null);
  $("#main").innerHTML=`<div class="page-h"><span class="eyebrow">내 학습 현황</span><h1>${esc(SID)}님의 학습 기록</h1><p class="muted">이 기기에 저장된 기록입니다.</p></div>
   <div class="card"><div class="stats"><div class="stat"><small>기출 정답률</small><b>${answered?Math.round(correct/answered*100)+"%":"-"}</b></div>
     <div class="stat"><small>푼 문제</small><b>${answered}/${Q.length}</b></div><div class="stat"><small>오답 노트</small><b>${S.wrong.length}</b></div></div>
    <div class="stats"><div class="stat"><small>사고 원인 찾기</small><b>${Object.values(S.cases).filter(x=>x.ok).length}/${C.length}</b></div>
     <div class="stat"><small>모의고사 최고</small><b>${S.mocks.length?Math.max(...S.mocks.map(x=>x.score)):"-"}</b></div><div class="stat"><small>셀프 테스트</small><b>${M.reduce((t,m)=>t+((S.memo[m.id]||{}).tests||0),0)}회</b></div></div></div>
   <div class="card"><h2>강별 진행</h2>${L.map(l=>{const s=lecStats(l.id);return `<div class="lecrow"><span>${l.id}강 <span class="small">${esc(l.title.slice(0,8))}</span></span><div class="bar"><i style="width:${s.progress}%"></i></div><span class="num">${s.progress}%</span></div>`}).join("")}
    <p class="small">진행률 = 본 개념 + 푼 기출 문제 + 사고 원인 찾기</p></div>
   <div class="card"><h2>추천 학습</h2>
    <div class="qlist"><button class="memo-set" data-golec="${weakLec.l.id}"><span><b>${weakLec.l.id}강 ${esc(weakLec.l.title)}</b><br><span class="small">${weakLec.s.acc!=null?`기출 정답률이 가장 낮아요 (${weakLec.s.acc}%)`:"아직 진행률이 가장 낮아요"}</span></span><span class="chip">강 학습</span></button>
     ${weakMemo?`<button class="memo-set" data-memo="${weakMemo.id}"><span><b>${esc(weakMemo.title)}</b><br><span class="small">${S.memo[weakMemo.id]&&S.memo[weakMemo.id].mastery!=null?`숙련도가 가장 낮아요 (${S.memo[weakMemo.id].mastery}%)`:"아직 셀프 테스트를 하지 않았어요"}</span></span><span class="chip">암기</span></button>`:""}
     ${S.wrong.length?`<button class="memo-set" data-wrongnote><span><b>오답 노트 ${S.wrong.length}문항</b><br><span class="small">틀린 문제를 다시 풀어 보세요</span></span><span class="chip bad">복습</span></button>`:""}</div></div>
   <div class="card"><div class="spread"><h2>설정</h2><div class="row"><button class="btn plain sm" data-act="font-down">글자 작게</button><button class="btn plain sm" data-act="font-up">글자 크게</button></div></div>
    <p class="sync">${CONFIG.SCRIPT_URL?`선생님께 보낼 기록 대기: ${queue.length}건 ${queue.length?"(인터넷이 연결되면 자동 전송)":"· 모두 전송됨"}`:"기록 전송이 설정되지 않아 이 기기에만 저장됩니다."}</p>
    <div id="reset-box"><button class="btn plain sm" data-reset>내 학습 기록 초기화</button></div></div>`;
  $("#main").onclick=e=>{
    const g=e.target.closest("[data-golec]");if(g){go("lec",{lec:+g.dataset.golec,tab:"concept",ci:0});return;}
    const mm=e.target.closest("[data-memo]");if(mm){go("memo",{set:mm.dataset.memo,tool:"test"});return;}
    if(e.target.closest("[data-wrongnote]")){startQuiz(shuffle(S.wrong.filter(id=>QBY[id])),"wrong");return;}
    if(e.target.closest("[data-reset]")){$("#reset-box").innerHTML=`<div class="confirm"><b>${esc(SID)}의 이 기기 학습 기록을 모두 지울까요?</b><span class="small">선생님께 이미 보낸 기록은 지워지지 않습니다.</span><div class="row"><button class="btn plain sm" data-cancel>취소</button><button class="btn sm" style="background:var(--bad);border-color:var(--bad)" data-yes>지우기</button></div></div>`;return;}
    if(e.target.closest("[data-cancel]")){go("me");return;}
    if(e.target.closest("[data-yes]")){S=blank();save();toast("학습 기록을 초기화했습니다");go("me");}
  };
};

/* ---------------- 시작 ---------------- */
$("#brand-title").textContent=CONFIG.TITLE;$("#brand-org").textContent=CONFIG.ORG||"";$("#brand-org").hidden=!CONFIG.ORG;document.title=CONFIG.TITLE;
if(SID){load();go("case",{lec:todayCase()});}else go("start");
flush();

</script>
</body>
</html>
